name: 👻 Ghost Agents — Build & Push (12 New Agents)

on:
  push:
    branches: [main]
    paths:
      # Trigger only when agent code or compose files change. Paths must match
      # the REAL on-disk directories (several here used to point at directories
      # that don't exist — see docs/NEXT_TASKS.md item #6).
      - "agents/06-security-engineer/**"
      - "agents/07-system-architect/**"
      - "agents/09-tips-tricks-writer/**"
      - "agents/throttle-agent/**"
      - "agents/super-hyper-broski-agent/**"
      - "agents/test-agent/**"
      - "agents/shared/**"
      - "agents/hyper-agents/architect/**"
      - "agents/hyper-agents/observer/**"
      - "agents/hyper-agents/worker/**"
      - "agents/hyper-split-agent/**"
      - "agents/session-snapshot/**"
      - "agents/agent-x/**"
      - "docker-compose.agents-full.yml"
      - ".github/workflows/ghost-agents-build.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Single agent to build (leave blank for all 12)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/welshdog

jobs:
  # ──────────────────────────────────────────────
  # PORT COLLISION CHECK — runs first, blocks all
  # ──────────────────────────────────────────────
  port-check:
    name: 🔌 Port Collision Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install pyyaml

      - name: Check for duplicate port mappings
        # A raw grep across every docker-compose*.yml false-positives here
        # (e.g. ai-backend and coder-agent both use :8002 but live behind
        # mutually-exclusive profiles that never launch together) and, before
        # the anchoring fix, silently missed every real "BIND_IP:HOST:CONTAINER"
        # mapping in the repo. Shared with health-check.yml so both gates
        # agree — see that script's header for the full file-scope rationale.
        run: python .github/scripts/check_duplicate_ports.py

      - name: Warn if :8080 is claimed multiple times
        run: |
          COUNT=$(grep -r "8080" docker-compose*.yml 2>/dev/null | wc -l)
          echo "Port :8080 references found: $COUNT"
          if [ "$COUNT" -gt 1 ]; then
            echo "⚠️  WARNING — port :8080 appears in multiple compose files. Verify test-agent doesn't conflict."
          fi

  # ──────────────────────────────────────────────
  # BUILD MATRIX — all 12 ghost agents in parallel
  # ──────────────────────────────────────────────
  build-ghost-agents:
    name: 🔨 Build ${{ matrix.agent }}
    runs-on: ubuntu-latest
    needs: port-check
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false   # Don't cancel all if one agent fails
      # Context/dockerfile pairs below are re-derived from the real, live
      # docker-compose.agents-full.yml / docker-compose.agents.yml service
      # definitions (2026-08-21) — most of the old paths here pointed at
      # directories that never existed. Ports match the post-2026-08-20
      # collision-fix values in CLAUDE.md's fleet table, not the old
      # pre-launch guesses. See docs/NEXT_TASKS.md item #6.
      matrix:
        include:
          - agent: security-engineer
            port: 8007
            context: ./agents/06-security-engineer
            dockerfile: Dockerfile
          - agent: system-architect
            port: 8010
            context: ./agents/07-system-architect
            dockerfile: Dockerfile
          - agent: tips-tricks-writer
            port: 8018
            context: ./agents/09-tips-tricks-writer
            dockerfile: Dockerfile
          - agent: throttle-agent
            port: 8014
            context: ./agents/throttle-agent
            dockerfile: Dockerfile
          - agent: super-hyper-broski
            port: 8015
            context: ./agents/super-hyper-broski-agent
            dockerfile: Dockerfile
          - agent: test-agent
            port: 8019
            # Needs the wider ./agents context — test-agent's code imports the
            # sibling agents/shared/agent_utils.py, unreachable from a context
            # scoped to its own directory.
            context: ./agents
            dockerfile: test-agent/Dockerfile
          - agent: hyper-architect
            port: 8091
            context: .
            dockerfile: agents/hyper-agents/architect/Dockerfile
          - agent: hyper-observer
            port: 8092
            context: .
            dockerfile: agents/hyper-agents/observer/Dockerfile
          - agent: hyper-worker
            port: 8093
            context: .
            dockerfile: agents/hyper-agents/worker/Dockerfile
          - agent: hyper-split-agent
            port: 8013
            context: ./agents/hyper-split-agent
            dockerfile: Dockerfile
          - agent: session-snapshot
            port: 8017
            context: ./agents/session-snapshot
            dockerfile: Dockerfile
          - agent: agent-x
            port: 8084
            context: .
            dockerfile: agents/agent-x/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skip if workflow_dispatch targets a specific agent
      - name: Check if this agent is targeted
        if: ${{ github.event.inputs.agent != '' && github.event.inputs.agent != matrix.agent }}
        run: |
          echo "Skipping ${{ matrix.agent }} — not the targeted agent"
          exit 0

      - name: Check agent Dockerfile exists
        id: check_dir
        run: |
          # Check the Dockerfile itself, not just the context directory —
          # several agents use `context: .` (repo root), which always exists
          # and would mask a missing/mis-pathed Dockerfile.
          DOCKERFILE_PATH="${{ matrix.context }}/${{ matrix.dockerfile }}"
          if [ -f "$DOCKERFILE_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ ${{ matrix.agent }} Dockerfile found at $DOCKERFILE_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  ${{ matrix.agent }} Dockerfile not found at $DOCKERFILE_PATH — skipping build"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dir.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_dir.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check_dir.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.agent }}
        if: steps.check_dir.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
            AGENT_PORT=${{ matrix.port }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Summary
        if: steps.check_dir.outputs.exists == 'true'
        run: |
          echo "### ✅ ${{ matrix.agent }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** ${{ matrix.port }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # FLEET STATUS — final summary after all builds
  # ──────────────────────────────────────────────
  fleet-status:
    name: 🚀 Fleet Status
    runs-on: ubuntu-latest
    needs: build-ghost-agents
    if: always()

    steps:
      - name: Fleet build summary
        run: |
          echo "## 👻 Ghost Agent Fleet — Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 12 ghost agents processed. Check individual jobs above for status." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Launch command (after builds succeed):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.yml -f docker-compose.agents-full.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull latest images from GHCR:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.agents-full.yml pull" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
