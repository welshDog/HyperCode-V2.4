name: Mission Executor Tests

# Runs the mission-executor tests (models, HTTP layer, lifespan, pub/sub task) with the SAME pinned
# dependencies the image installs, so a FastAPI / Starlette / pydantic bump is checked here first.
on:
  pull_request:
    paths:
      - 'agents/mission-executor/**'
      - '.github/workflows/mission-executor-tests.yml'
  push:
    branches: [main]
    paths:
      - 'agents/mission-executor/**'
      - '.github/workflows/mission-executor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-executor:
    name: mission-executor (pytest, Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/mission-executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/mission-executor/requirements.txt
      - name: Install the service's pinned dependencies
        run: pip install -r requirements.txt pytest
      - name: Run the tests
        # From the service directory: its modules are imported as top-level names (`from models import ...`).
        run: python -m pytest -q
