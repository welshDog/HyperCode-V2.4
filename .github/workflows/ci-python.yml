name: CI — Python

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/requirements*.txt'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/requirements*.txt'

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Import application
        working-directory: backend
        env:
          ENVIRONMENT: test
        run: python -c "from app.main import app; assert app is not None; print('backend-import-ok')"
      - name: Run tests
        run: pytest backend/tests -v --tb=short
