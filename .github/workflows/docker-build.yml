name: Docker Build & Test

permissions:
  contents: read
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hypercode-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agents:
    runs-on: ubuntu-latest
    strategy:
      # One broken agent must not cancel the others' builds.
      fail-fast: false
      matrix:
        # `dir` is the folder under agents/ (matches the build contexts in docker-compose.agents.yml).
        include:
          - agent: coder
            dir: coder
          - agent: frontend-specialist
            dir: 01-frontend-specialist
          - agent: backend-specialist
            dir: 02-backend-specialist
          - agent: database-architect
            dir: 03-database-architect
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # coder's Dockerfile does `FROM agent-base:latest`, a shared base image that is
      # not published anywhere and is not built by compose, so a clean runner gets
      # "pull access denied". Build it first (same approach as docker-push.yml).
      # `load: true` makes it visible to the next step's FROM; it is never pushed.
      - name: Build agent-base (local dependency for coder)
        if: matrix.agent == 'coder'
        uses: docker/build-push-action@v5
        with:
          context: ./agents
          file: ./agents/Dockerfile.base
          push: false
          load: true
          tags: agent-base:latest
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,mode=max,scope=agent-base

      - name: Build ${{ matrix.agent }} image
        uses: docker/build-push-action@v5
        with:
          context: ./agents/${{ matrix.dir }}
          file: ./agents/${{ matrix.dir }}/Dockerfile
          push: false
          tags: hypercode-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-spawner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent-spawner image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-spawner
          file: ./services/agent-spawner/Dockerfile
          push: false
          tags: agent-spawner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/ --exit-zero

      - name: Lint agents
        run: ruff check agents/ --exit-zero

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compose v2 only: the hosted runner has no `docker-compose` v1 binary.
      # The files need a .env (core uses `env_file: .env`) and two required
      # variables; CI uses non-secret placeholders. --quiet: never print the
      # expanded config.
      - name: Prepare .env and show Compose version
        run: |
          cp .env.example .env
          docker compose version

      - name: Validate core
        env:
          POSTGRES_PASSWORD: ci-placeholder
          API_KEY: ci-placeholder
        run: docker compose -f docker-compose.core.yml config --quiet

      # agents.yml is an overlay (depends on services defined in core), so it is
      # only valid together with core.
      - name: Validate core + agents
        env:
          POSTGRES_PASSWORD: ci-placeholder
          API_KEY: ci-placeholder
        run: docker compose -f docker-compose.core.yml -f docker-compose.agents.yml config --quiet

      - name: Validate observability
        env:
          POSTGRES_PASSWORD: ci-placeholder
          API_KEY: ci-placeholder
        run: docker compose -f docker-compose.observability.yml config --quiet

      # The default file `include:`s every other compose file.
      - name: Validate default (include everything)
        env:
          POSTGRES_PASSWORD: ci-placeholder
          API_KEY: ci-placeholder
        run: docker compose config --quiet

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
