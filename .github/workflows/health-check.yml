name: 💚 HyperCode Health Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: ⚡ Ecosystem Health Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: 🔍 Lint Sacred Rules — check no docker.io references
        run: |
          echo "Checking for forbidden docker.io references..."
          if grep -r "docker.io" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.sh" .; then
            echo "FAIL: docker.io found! Use docker-ce-cli only."
            exit 1
          else
            echo "PASS: No docker.io references found."
          fi

      - name: 🔍 Lint Sacred Rules — check no backend.app imports
        run: |
          echo "Checking for forbidden 'from backend.app' imports..."
          if grep -r "from backend\.app" --include="*.py" .; then
            echo "FAIL: 'from backend.app' import found! Use 'from app.X import Y'."
            exit 1
          else
            echo "PASS: No forbidden imports found."
          fi

      - name: 🔍 Lint Sacred Rules — check Python indentation (no 3-space indent)
        run: |
          echo "Checking for 3-space Python indentation..."
          if grep -rP "^   [^ ]" --include="*.py" .; then
            echo "WARN: Possible 3-space indent detected. Use 4 spaces always."
          else
            echo "PASS: Python indentation looks clean."
          fi

      - name: 🔍 Lint Sacred Rules — check Redis DB assignments
        run: |
          echo "Checking Redis DB assignments in compose files..."
          # Throttle-agent must use DB 1, never DB 0
          if grep -A5 "throttle-agent" docker-compose.agents-full.yml | grep "REDIS_URL" | grep -v "redis:6379/1"; then
            echo "FAIL: throttle-agent must use Redis DB 1 (rate limits)!"
            exit 1
          else
            echo "PASS: throttle-agent Redis DB 1 confirmed."
          fi

      - name: 🔍 Check .env not committed
        run: |
          echo "Checking .env files are not committed..."
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "FAIL: .env file found in repo! Remove immediately."
            exit 1
          else
            echo "PASS: No .env files committed."
          fi

      - name: 📄 Validate docker-compose files
        run: |
          echo "Checking docker-compose YAML files are valid..."
          python -c "
import yaml, glob, sys
files = glob.glob('docker-compose*.yml') + glob.glob('docker-compose*.yaml')
errors = []
for f in files:
    try:
        with open(f) as fh:
            yaml.safe_load(fh)
        print(f'PASS: {f}')
    except Exception as e:
        print(f'FAIL: {f} -> {e}')
        errors.append(f)
if errors:
    sys.exit(1)
"

      - name: 🔍 Verify no duplicate host ports in compose
        run: |
          echo "Checking for duplicate host port mappings..."
          python -c "
import yaml, sys, re

files = ['docker-compose.yml', 'docker-compose.agents-full.yml']
all_ports = []
errors = []

for fname in files:
    try:
        with open(fname) as f:
            doc = yaml.safe_load(f)
        services = doc.get('services', {})
        for svc, cfg in services.items():
            for p in (cfg or {}).get('ports', []):
                host_port = str(p).split(':')[0].split('127.0.0.1:')[-1]
                if host_port in all_ports:
                    errors.append(f'DUPLICATE PORT {host_port} in {svc} ({fname})')
                all_ports.append(host_port)
    except FileNotFoundError:
        pass

if errors:
    for e in errors:
        print(e)
    sys.exit(1)
else:
    print(f'PASS: No duplicate ports across {len(all_ports)} mappings checked.')
"

      - name: 🏥 Verify all 25 agent ports declared in compose
        run: |
          echo "Verifying all 25 agent ports are declared..."
          python -c "
import yaml, sys

# Full agent port registry (docker-compose.agents-full.yml only — docker-compose.yml
# is an `include:` wrapper with no services of its own, so it never contributes ports
# here; that also means this gate can't see docker-compose.agents.yml's real, live
# hypercode-mcp-server at :8823 — it's deliberately not in this list, see below).
# Synced 2026-08-20 to agents-full.yml's post-collision-fix ports.
EXPECTED_PORTS = {
    '8001': 'project-strategist',
    '8002': 'coder-agent',
    '8003': 'backend-specialist',
    '8004': 'database-architect',
    '8005': 'qa-engineer',
    '8006': 'devops-engineer',
    '8007': 'security-engineer',
    '8010': 'system-architect',
    '8011': 'frontend-specialist',
    '8013': 'hyper-split-agent',
    '8014': 'throttle-agent',
    '8015': 'super-hyper-broski-agent',
    '8017': 'session-snapshot',
    '8018': 'tips-tricks-writer',
    '8019': 'test-agent',
    '8020': 'business-agent',
    '8024': 'coderabbit-webhook',
    '8050': 'goal-keeper',
    '8081': 'crew-orchestrator',
    '8082': 'brain-agent',
    '8083': 'agent-x',
    '8091': 'hyper-architect',
    '8092': 'hyper-observer',
    '8093': 'hyper-worker',
    # hypercode-mcp-server (:8823) intentionally omitted: it's the real, live core
    # service in docker-compose.agents.yml, not a ghost agent this ghost-roster gate
    # tracks. A phantom duplicate of it in agents-full.yml was removed 2026-08-20.
}

found_ports = set()
files = ['docker-compose.yml', 'docker-compose.agents-full.yml']
for fname in files:
    try:
        with open(fname) as f:
            doc = yaml.safe_load(f)
        for svc, cfg in (doc.get('services') or {}).items():
            for p in (cfg or {}).get('ports', []):
                host_port = str(p).split(':')[0].split('127.0.0.1:')[-1]
                found_ports.add(host_port)
    except FileNotFoundError:
        pass

missing = []
for port, name in EXPECTED_PORTS.items():
    if port not in found_ports:
        missing.append(f'  MISSING: :{port} ({name})')

if missing:
    print('FAIL: Some agent ports not declared in compose files:')
    for m in missing:
        print(m)
    sys.exit(1)
else:
    print(f'PASS: All {len(EXPECTED_PORTS)} agent ports confirmed in compose files.')
"

      - name: ✅ Health Check Complete
        run: |
          echo ""
          echo "💚 All health checks passed! BROski♾️ is looking healthy."
          echo "🤖 25 agents verified: 13 core + 12 ghost agents"
          echo "🏴󠁧󠁢󠁷󠁬󠁳󠁥 Built in Llanelli, South Wales by @welshDog"
