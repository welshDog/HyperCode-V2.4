name: HyperHealth Tests

# Runs the hyperhealth tests (unit + HTTP smoke) with the SAME pinned dependencies the image installs,
# so a FastAPI / Starlette / pydantic bump is checked here before it reaches the container.
on:
  pull_request:
    paths:
      - 'agents/hyperhealth/**'
      - '.github/workflows/hyperhealth-tests.yml'
  push:
    branches: [main]
    paths:
      - 'agents/hyperhealth/**'
      - '.github/workflows/hyperhealth-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperhealth:
    name: hyperhealth (pytest, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/hyperhealth/requirements.txt
      - name: Install the service's pinned dependencies
        run: pip install -r agents/hyperhealth/requirements.txt pytest pytest-asyncio
      - name: Run the tests
        # From the repository root: the tests patch `agents.hyperhealth.worker`.
        run: PYTHONPATH=. pytest agents/hyperhealth/tests -q
