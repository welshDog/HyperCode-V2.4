# Runtime integration test of the images docker-push.yml publishes (pulled from GHCR :latest):
# starts them on a throwaway network with Redis, makes real requests, runs a real MCP session,
# and has the source-built Compose spawn a container. Complements the build/scan PR checks.
# skillweaver and memstream are not published by docker-push.yml, so they are built from the checkout.
name: Images integration test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/images-integration.yml"
      - "scripts/ci/images-integration.sh"

permissions:
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration checks
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          export REGISTRY_PREFIX="ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]')"
          bash scripts/ci/images-integration.sh
