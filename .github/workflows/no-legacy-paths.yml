name: No Legacy Paths Guard

permissions:
  contents: read
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check-legacy-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Search for deprecated HyperCode-V2.0 paths
        run: |
          echo "Scanning for legacy 'HyperCode-V2.0' references..."
          # The guard targets live code and config. Left alone on purpose:
          #   - reports/, docs/, notes/, archive/, artifacts/, .trae/,
          #     HyperFocus_Audit_Methodology/: history and evidence, true as written.
          #   - .claude/: vendored skill packs that describe the archived upstream repo.
          #   - agents/*hyper agent*: saved chat transcripts.
          #   - mcp/config*.yaml: dead host-mount paths; changing them would change
          #     what the filesystem MCP server can read, so that needs its own decision.
          #   - this workflow (it names the string it searches for).
          if git grep -n -I "HyperCode-V2\.0" -- . \
              ':(exclude)reports' ':(exclude)docs' ':(exclude)notes' \
              ':(exclude)archive' ':(exclude)artifacts' ':(exclude).trae' \
              ':(exclude)HyperFocus_Audit_Methodology' ':(exclude).claude' \
              ':(exclude,icase)agents/*hyper agent*' \
              ':(exclude)mcp/config.yaml' ':(exclude)mcp/config.host.yaml' \
              ':(exclude).github/workflows/no-legacy-paths.yml'; then
            echo "::error::Found legacy 'HyperCode-V2.0' path references in the codebase!"
            echo "Please update these references to the V3+ canonical entrypoint (e.g., 'HyperCode-V2.4' or relative paths)."
            exit 1
          else
            echo "No legacy paths found. Check passed!"
          fi
