name: Agent secret-file helper in sync

# Every agent that reads an API key does so through read_secret() so a Compose secret file (<NAME>_FILE) works.
# The function is VENDORED into each agent file (agents ship as isolated images). This lane fails if any copy
# drifts from agents/shared/secret_env.py, or if a raw os.getenv("..._API_KEY") read is reintroduced.
# Standalone on purpose: it triggers on ANY agents/** change (the agent-safety lane only watches a few folders).

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'scripts/vendor_secret_env.py'
      - 'scripts/mint_agent_keys.py'
      - 'scripts/test_mint_agent_keys.py'
      - '.github/scripts/tests/test_agent_secret_env_*.py'
      - '.github/workflows/secret-env-sync.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'scripts/vendor_secret_env.py'
      - 'scripts/mint_agent_keys.py'
      - 'scripts/test_mint_agent_keys.py'
      - '.github/scripts/tests/test_agent_secret_env_*.py'
      - '.github/workflows/secret-env-sync.yml'

permissions:
  contents: read

jobs:
  secret-env-sync:
    name: vendored read_secret in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install pytest

      - name: Vendored copies identical to the canonical helper
        run: python scripts/vendor_secret_env.py --check

      - name: Helper + drift + raw-read guard tests
        run: python -m pytest .github/scripts/tests/test_agent_secret_env_helper.py .github/scripts/tests/test_agent_secret_env_sync.py -q

      - name: Key-minting script safety tests
        run: python -m unittest discover -s scripts -p "test_mint_agent_keys.py" -v
