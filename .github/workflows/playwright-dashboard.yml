name: Playwright Dashboard E2E

permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "agents/dashboard/**"
      - "tests/e2e/dashboard/**"
      - "playwright.config.ts"
      - "scripts/e2e/**"
  pull_request:
    paths:
      - "agents/dashboard/**"
      - "tests/e2e/dashboard/**"
      - "playwright.config.ts"
      - "scripts/e2e/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # scripts/e2e/start-dashboard.mjs runs "next dev" inside agents/dashboard,
      # which needs its own node_modules (next, typescript, @types/*).
      - name: Install dashboard deps
        run: npm ci --prefix agents/dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          CI: "1"
          DASHBOARD_PORT: "3010"
        run: npx playwright test

      # Failure snapshots (page ARIA tree, trace, screenshots) for diagnosis.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dashboard-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

