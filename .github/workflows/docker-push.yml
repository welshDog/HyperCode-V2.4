name: 🐳 Docker Push to Registry

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'services/**'
      - '.github/workflows/docker-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery-worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/celery-worker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/celery-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════
  # TIER 1+2: CORE + SPECIALIST AGENTS (13 original)
  # ═══════════════════════════════════════════════════════
  push-agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Core crew ---
          - agent: crew-orchestrator
            context: ./agents/crew-orchestrator
          - agent: brain-agent
            context: ./agents/brain
          - agent: coder
            context: ./agents/coder
          - agent: agent-x
            context: ./agents/agent-x
          # --- Specialist squad ---
          - agent: frontend-specialist
            context: ./agents/01-frontend-specialist
          - agent: backend-specialist
            context: ./agents/02-backend-specialist
          - agent: database-architect
            context: ./agents/03-database-architect
          - agent: qa-engineer
            context: ./agents/04-qa-engineer
          - agent: devops-engineer
            context: ./agents/05-devops-engineer
          - agent: security-engineer
            context: ./agents/06-security-engineer
          - agent: system-architect
            context: ./agents/07-system-architect
          - agent: project-strategist
            context: ./agents/08-project-strategist
          - agent: tips-tricks-writer
            context: ./agents/09-tips-tricks-writer
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.agent }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-${{ matrix.agent }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════
  # TIER 3: 12 GHOST AGENTS — Infrastructure squad
  # ═══════════════════════════════════════════════════════
  push-ghost-agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: hyper-architect
            context: ./agents/architect
            dockerfile: Dockerfile
          - agent: hyper-observer
            context: ./agents/hyper-agents
            dockerfile: Dockerfile.observer
          - agent: hyper-worker
            context: ./agents/hyper-agents
            dockerfile: Dockerfile.worker
          - agent: hyper-split-agent
            context: ./agents/hyper-agents
            dockerfile: Dockerfile.split
          - agent: session-snapshot
            context: ./agents/hyper-agents
            dockerfile: Dockerfile.snapshot
          - agent: throttle-agent
            context: ./agents/throttle-agent
            dockerfile: Dockerfile
          - agent: super-hyper-broski-agent
            context: ./agents/super-hyper-broski-agent
            dockerfile: Dockerfile
          - agent: test-agent
            context: ./agents/test-agent
            dockerfile: Dockerfile
          - agent: goal-keeper
            context: ./agents/goal_keeper
            dockerfile: Dockerfile
          - agent: business-agent
            context: ./agents/business-agent
            dockerfile: Dockerfile
          - agent: coderabbit-webhook
            context: ./agents/coderabbit-webhook
            dockerfile: Dockerfile
          - agent: hypercode-mcp-server
            context: ./agents/hypercode-mcp-server
            dockerfile: Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.agent }} (ghost)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-${{ matrix.agent }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-spawner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-spawner
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-spawner
          file: ./services/agent-spawner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: [push-backend, push-agents, push-ghost-agents, push-spawner]
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker Scout on backend
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:latest
          exit-code: false
          to-latest: false

      - name: Run Docker Scout on crew-orchestrator
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-crew-orchestrator:latest
          exit-code: false
          to-latest: false

  notify:
    runs-on: ubuntu-latest
    needs: [push-backend, push-agents, push-ghost-agents, push-spawner, security-scan]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "# 🐳 Docker Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (core + celery) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Core + Specialist agents (13) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Ghost agents (12) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent spawner | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | ✅ complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🤖 **25 agents live in GHCR** — registry: ghcr.io/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "🏴󠁧󠁢󠁷󠁬󠁳󠁥 Built in Llanelli, South Wales by @welshDog" >> $GITHUB_STEP_SUMMARY
