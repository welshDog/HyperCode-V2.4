name: 🐳 Docker Push to Registry

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'services/**'
      - '.github/workflows/docker-push.yml'

env:
  REGISTRY: ghcr.io

jobs:
  # GHCR requires an all-lowercase repository path, but `github.repository`
  # preserves the real (possibly mixed-case) org/repo name -- e.g.
  # `welshDog/HyperCode-V2.4`, which fails every push with "repository name
  # must be lowercase". Actions expressions have no built-in lower() function,
  # so this computes it once via shell and every other job reads the output.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.lowercase.outputs.image_name }}
    steps:
      - name: Compute lowercase image name
        id: lowercase
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  push-backend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-core:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery-worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/celery-worker:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/celery-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════
  # TIER 1+2: CORE + SPECIALIST AGENTS (13 original)
  # ═══════════════════════════════════════════════════════
  push-agents:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Core crew ---
          - agent: crew-orchestrator
            context: ./agents/crew-orchestrator
          - agent: brain-agent
            context: ./agents/brain
          - agent: coder
            context: ./agents/coder
          # agent-x moved to push-ghost-agents below 2026-09-27: its Dockerfile
          # COPYs `agents/agent-x/...` (repo-root-relative), same bug class as
          # hyper-observer/hyper-worker -- this job's build step hardcodes
          # `file: ${context}/Dockerfile`, which can't express a context/dockerfile
          # split, so a repo-root-context agent can't live in this matrix at all.
          # --- Specialist squad ---
          - agent: frontend-specialist
            context: ./agents/01-frontend-specialist
          - agent: backend-specialist
            context: ./agents/02-backend-specialist
          - agent: database-architect
            context: ./agents/03-database-architect
          - agent: qa-engineer
            context: ./agents/04-qa-engineer
          - agent: devops-engineer
            context: ./agents/05-devops-engineer
          - agent: security-engineer
            context: ./agents/06-security-engineer
          - agent: system-architect
            context: ./agents/07-system-architect
          - agent: project-strategist
            context: ./agents/08-project-strategist
          - agent: tips-tricks-writer
            context: ./agents/09-tips-tricks-writer
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # coder's Dockerfile does `FROM agent-base:latest` -- a shared base image that
      # agents/Dockerfile.base's own header comment says is "NOT built by compose" and
      # must be rebuilt manually (`docker build -t agent-base:latest -f
      # agents/Dockerfile.base agents/`). That never happened in CI, so `coder` always
      # got "pull access denied" here -- it only ever worked on boxes where someone had
      # built agent-base locally at some point. A buildx `load: true` build does NOT fix
      # this: the buildx docker-container builder cannot see images in the runner's
      # local Docker daemon, so the next buildx step still tried to pull
      # docker.io/library/agent-base:latest (pull access denied) -- the same failure,
      # verified in CI, that docker-build.yml hit. Plain `docker build` uses the daemon,
      # so coder is built and pushed with plain docker commands instead. agent-base is
      # never pushed -- it's a local build dependency, not a published image.
      - name: Build agent-base, then build and push coder (plain docker build)
        if: matrix.agent == 'coder'
        env:
          IMG: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-coder
          SHA: ${{ github.sha }}
        run: |
          docker build -t agent-base:latest -f agents/Dockerfile.base agents/
          docker build -t "$IMG:latest" -t "$IMG:$SHA" agents/coder
          docker push "$IMG:latest"
          docker push "$IMG:$SHA"

      - name: Build and push ${{ matrix.agent }}
        if: matrix.agent != 'coder'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-${{ matrix.agent }}:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════
  # TIER 3: 12 GHOST AGENTS — Infrastructure squad
  # ═══════════════════════════════════════════════════════
  push-ghost-agents:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: hyper-architect
            context: ./agents/architect
            dockerfile: Dockerfile
          # context MUST be repo root: both Dockerfiles COPY from
          # agents/hyper-agents/{observer,worker}/ AND the shared
          # src/agents/hyper_agents/ package, unreachable from a narrower
          # context. Fixed 2026-08-20 alongside docker-compose.agents-full.yml
          # — .dockerignore also had a blanket `agents/` exclusion that
          # blocked this even with the right context; see .dockerignore.
          - agent: hyper-observer
            context: .
            dockerfile: agents/hyper-agents/observer/Dockerfile
          - agent: hyper-worker
            context: .
            dockerfile: agents/hyper-agents/worker/Dockerfile
          # Same bug class as hyper-observer/hyper-worker above, found 2026-09-27:
          # agents/agent-x/Dockerfile COPYs `agents/agent-x/requirements.txt` and
          # `agents/agent-x/` (repo-root-relative paths), so it needs context: .
          # too -- matches this agent's own local compose definitions
          # (docker-compose.agents.yml / docker-compose.hyper-agents.yml), which
          # already build it this way and never hit this bug locally.
          - agent: agent-x
            context: .
            dockerfile: agents/agent-x/Dockerfile
          - agent: hyper-split-agent
            context: ./agents/hyper-split-agent
            dockerfile: Dockerfile
          - agent: session-snapshot
            context: ./agents/session-snapshot
            dockerfile: Dockerfile
          - agent: throttle-agent
            context: ./agents/throttle-agent
            dockerfile: Dockerfile
          - agent: super-hyper-broski-agent
            context: ./agents/super-hyper-broski-agent
            dockerfile: Dockerfile
          # context MUST be ./agents, not ./agents/test-agent: the Dockerfile
          # COPYs a sibling `agents/shared/` (agent_utils.py etc.), unreachable
          # from the narrower context -- same fix already applied to
          # docker-compose.agents-full.yml on 2026-08-20, never ported here.
          # Found 2026-09-27 alongside the agent-x context bug above.
          - agent: test-agent
            context: ./agents
            dockerfile: test-agent/Dockerfile
          - agent: goal-keeper
            context: ./agents/goal_keeper
            dockerfile: Dockerfile
          # business-agent: built for real 2026-08-20, replacing the mislabeled
          # project-strategist clone that lived at ./agents/business/project-strategist.
          # Real code now lives directly at ./agents/business (flattened to match this
          # context path, no more nesting). See docs/NEXT_TASKS.md P2-1.
          - agent: business-agent
            context: ./agents/business
            dockerfile: Dockerfile
          - agent: coderabbit-webhook
            context: ./agents/coderabbit-webhook
            dockerfile: Dockerfile
          - agent: fleet-controller
            context: ./agents/fleet-controller
            dockerfile: Dockerfile
          - agent: governor
            context: ./agents/governor
            dockerfile: Dockerfile
          - agent: hypercode-mcp-server
            context: ./services/hypercode-mcp-server
            dockerfile: Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.agent }} (ghost)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-${{ matrix.agent }}:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/hypercode-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-spawner:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-spawner
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-spawner
          file: ./services/agent-spawner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/agent-spawner:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/agent-spawner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Advisory CVE scan of EVERY image this workflow just pushed (HIGH/CRITICAL, fixable only).
  # This replaced Docker Scout, which needs a Docker Hub login with a Scout entitlement
  # this job never had ("could not authenticate: user githubactions not entitled to
  # use Docker Scout"). Trivy needs no Docker Hub account and is what the rest of this
  # repo's CI already uses. Findings are printed in the log and do NOT fail the run
  # (exit-code 0, the same advisory intent as Scout's exit-code: false); a tool or
  # registry-auth error still fails the job, so a broken scan is not silently skipped.
  # It scans the :<sha> tag, i.e. exactly what this run pushed, not whatever :latest is.
  security-scan:
    runs-on: ubuntu-latest
    needs: [prepare, push-backend, push-agents, push-ghost-agents, push-spawner]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # every image this workflow pushes (keep in step with the push-* jobs above)
        image:
          - hypercode-core
          - hypercode-crew-orchestrator
          - celery-worker
          - agent-spawner
          - hypercode-brain-agent
          - hypercode-coder
          - hypercode-frontend-specialist
          - hypercode-backend-specialist
          - hypercode-database-architect
          - hypercode-qa-engineer
          - hypercode-devops-engineer
          - hypercode-security-engineer
          - hypercode-system-architect
          - hypercode-project-strategist
          - hypercode-tips-tricks-writer
          - hypercode-hyper-architect
          - hypercode-hyper-observer
          - hypercode-hyper-worker
          - hypercode-agent-x
          - hypercode-hyper-split-agent
          - hypercode-session-snapshot
          - hypercode-throttle-agent
          - hypercode-super-hyper-broski-agent
          - hypercode-test-agent
          - hypercode-goal-keeper
          - hypercode-business-agent
          - hypercode-coderabbit-webhook
          - hypercode-fleet-controller
          - hypercode-governor
          - hypercode-hypercode-mcp-server
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          timeout: 30m

  notify:
    runs-on: ubuntu-latest
    needs: [push-backend, push-agents, push-ghost-agents, push-spawner, security-scan]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "# 🐳 Docker Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (core + celery) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Core + Specialist agents (13) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Ghost agents (12) | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent spawner | ✅ pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | ✅ complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🤖 **25 agents live in GHCR** — registry: ghcr.io/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "🏴󠁧󠁢󠁷󠁬󠁳󠁥 Built in Llanelli, South Wales by @welshDog" >> $GITHUB_STEP_SUMMARY
