name: Docker Push to Registry

permissions:
  contents: read
on:
  read
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'services/**'
      - '.github/workflows/docker-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery-worker (same image as core)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/celery-worker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/celery-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [coder, frontend-specialist, backend-specialist, database-architect, qa-engineer, devops-engineer, security-engineer]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.agent }} agent
        uses: docker/build-push-action@v5
        with:
          context: ./agents/${{ matrix.agent }}
          file: ./agents/${{ matrix.agent }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.agent }}-agent:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.agent }}-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-spawner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-spawner
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-spawner
          file: ./services/agent-spawner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: [push-backend, push-agents, push-spawner]
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker Scout on backend
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:latest
          exit-code: false
          to-latest: false

      - name: Run Docker Scout on agent-spawner
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:latest
          exit-code: false
          to-latest: false

  notify:
    runs-on: ubuntu-latest
    needs: [push-backend, push-agents, push-spawner, security-scan]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "# Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ✅ pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hypercode-core:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Agents: ✅ pushed (7 variants)" >> $GITHUB_STEP_SUMMARY
          echo "- Spawner: ✅ pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-spawner:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
