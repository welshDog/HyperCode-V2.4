      # Held on purpose (2026-10-31): a newer eslint-config-next lets eslint-plugin-react-hooks float to 7.1.x,
      # which enables set-state-in-effect and turns Lint red. Remove these two once that rule is addressed.
      - dependency-name: "eslint-config-next"
      - dependency-name: "eslint-plugin-react-hooks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "agents"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # vitest and @vitest/coverage-v8 pin each other, so they must move in one PR (first match wins).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

