# HyperCode V2.4 — Dependabot Auto-Update Config
# Keeps Python + npm deps patched automatically 🛡️

version: 2

updates:

  # ── Python (pip) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors need a planned migration; bulk-closed 2026-10-18 (docs/NEXT_TASKS.md).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ignore major version bumps on openai — test manually
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

