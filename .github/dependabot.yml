# HyperCode V2.4 — Dependabot Auto-Update Config
# Keeps Python + npm deps patched automatically 🛡️

version: 2

updates:

  # ── Python (pip) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors need a planned migration; bulk-closed 2026-10-18 (docs/NEXT_TASKS.md).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ignore major version bumps on openai — test manually
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    ignore:
      # Majors need a planned migration; bulk-closed 2026-10-18 (docs/NEXT_TASKS.md).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry family moves in lockstep (sdk requires api==same version); a lone or partial bump
      # cannot resolve. Bump it by hand as one PR (see reports/dependency-bumps/2026-10-31/).
      - dependency-name: "opentelemetry*"
      # Minor bumps of a 300-pin freeze arrived as 200+ updates in one PR nobody could review (#711, #712).
      # Patch-only here; do minor upgrades by hand in small, tested batches.
      - dependency-name: "*"
        update-types: ["version-update:semver-minor"]
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
