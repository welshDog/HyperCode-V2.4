services:
  postgres:
    ports:
      - "5432:5432"
  worker:
    profiles: ["agents"]
    ports:
      - "9010:8080"
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
  watcher:
    ports:
      - "9011:8080"
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/db
  always-on-consumer:
    ports:
      - "9012:8080"
    depends_on:
      - worker
