# docker-compose.yml — Root compose file (entry point)
# Usage: docker compose up -d  (includes all layers)
# Usage: docker compose -f docker-compose.core.yml up -d  (only core)
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.agents.yml up -d  (core + agents)


# Intentionally minimal — includes all other files via extend
#
# ⚠️ Never pass any of the files below to `-f` alongside this file — they're
# already pulled in via `include:`. Doing so merges each service with itself;
# list-type fields like `security_opt` get concatenated onto their own
# duplicate, which Compose then rejects (e.g. "services.X.security_opt items
# at 0 and 1 are equal" — issue #435, root-caused 2026-08-22, was never a real
# YAML bug in the included files themselves).
include:
  - docker-compose.core.yml
  - docker-compose.observability.yml
  - docker-compose.agents.yml
  - docker-compose.obsidian-sync.yml    # Crew→vault sync: watcher (--profile agents) + one-shot (--profile vault-sync)
  - docker-compose.bropets.yml          # BROskiPets integration (--profile pets)
  - docker-compose.brain.yml            # Obsidian-Brain integration (--profile brain)
  - docker-compose.grafana-cloud.yml    # Grafana Cloud remote-write pipeline (--profile grafana-cloud)

# Note: frontend-net defined here (used by dashboard, mission-ui)
networks:
  frontend-net:
    driver: bridge
    name: hypercode_frontend_net
