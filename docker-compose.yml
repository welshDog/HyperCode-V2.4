# docker-compose.yml — Root compose file (entry point)
# Usage: docker compose up -d  (includes all layers)
# Usage: docker compose -f docker-compose.core.yml up -d  (only core)
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.agents.yml up -d  (core + agents)

version: '3.9'

# Intentionally minimal — includes all other files via extend
include:
  - docker-compose.core.yml
  - docker-compose.observability.yml
  - docker-compose.agents.yml

# Note: frontend-net defined here (used by dashboard, mission-ui)
networks:
  frontend-net:
    driver: bridge
    name: hypercode_frontend_net
