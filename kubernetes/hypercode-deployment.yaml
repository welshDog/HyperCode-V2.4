apiVersion: v1
kind: Namespace
metadata:
  name: hypercode
  labels:
    name: hypercode

---
# ════════════════════════════════════════════════════════════════════════════════
# HyperCode V2.4 — Kubernetes Deployment
# Multi-region ready with KEDA auto-scaling
# Created: May 21, 2026
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypercode-core
  namespace: hypercode
  labels:
    app: hypercode-core
    tier: core
    version: v2.4.2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hypercode-core
  template:
    metadata:
      labels:
        app: hypercode-core
        tier: core
    spec:
      serviceAccountName: hypercode-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hypercode-core
        image: docker.io/w3lshdog/hypercode-core:v2.4.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9100
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hypercode-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hypercode-secrets
              key: redis-url
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: hypercode-secrets
              key: api-key
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hypercode-core
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: hypercode-core
  namespace: hypercode
  labels:
    app: hypercode-core
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
  selector:
    app: hypercode-core

---
apiVersion: autoscaling.keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hypercode-core-scaler
  namespace: hypercode
spec:
  scaleTargetRef:
    name: hypercode-core
  minReplicaCount: 3
  maxReplicaCount: 10
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: http_request_duration_seconds
      query: |
        rate(http_request_duration_seconds_sum[1m]) / 
        rate(http_request_duration_seconds_count[1m])
      threshold: "1000"

---
# ════════════════════════════════════════════════════════════════════════════════
# CREW ORCHESTRATOR — Agent coordinator
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crew-orchestrator
  namespace: hypercode
  labels:
    app: crew-orchestrator
    tier: core
spec:
  serviceName: crew-orchestrator
  replicas: 1  # Only one orchestrator for consensus
  selector:
    matchLabels:
      app: crew-orchestrator
  template:
    metadata:
      labels:
        app: crew-orchestrator
        tier: core
    spec:
      serviceAccountName: crew-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: crew-orchestrator
        image: docker.io/w3lshdog/hypercode-crew-orchestrator:v2.4.2
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ORCHESTRATOR_MODE
          value: "kubernetes"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hypercode-secrets
              key: redis-url
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1.5Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: crew-orchestrator
  namespace: hypercode
spec:
  clusterIP: None
  selector:
    app: crew-orchestrator
  ports:
  - port: 8080
    targetPort: 8080

---
# ════════════════════════════════════════════════════════════════════════════════
# RBAC — Service accounts & permissions
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypercode-core
  namespace: hypercode

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crew-orchestrator
  namespace: hypercode

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypercode-core
  namespace: hypercode
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypercode-core
  namespace: hypercode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hypercode-core
subjects:
- kind: ServiceAccount
  name: hypercode-core
  namespace: hypercode

---
# ════════════════════════════════════════════════════════════════════════════════
# NETWORK POLICY — Zero-trust networking
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypercode-deny-all
  namespace: hypercode
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypercode-core-allow
  namespace: hypercode
spec:
  podSelector:
    matchLabels:
      app: hypercode-core
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: hypercode
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: hypercode
    ports:
    - protocol: TCP
      port: 5432  # postgres
    - protocol: TCP
      port: 6379  # redis

---
# ════════════════════════════════════════════════════════════════════════════════
# MONITORING — Prometheus ServiceMonitor
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hypercode-core
  namespace: hypercode
  labels:
    app: hypercode-core
spec:
  selector:
    matchLabels:
      app: hypercode-core
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
