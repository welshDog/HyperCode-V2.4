[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-benchmark==5.3.0",
    "hypothesis==6.167.1",
    "factory_boy==3.3.3",
    "Faker==33.2.0",
    "black==26.5.1",
    "ruff==0.16.5",
    "flake8==7.3.0",
    "pylint==4.0.8",
    "mypy==1.14.1",
    "isort==6.0.1",
    "bandit==1.9.4",
    "bandit-baseline==1.8.0",
    "semgrep==1.176.0",
    "pip-audit==2.10.1",
    "detect-secrets==1.6.0",
]

ai = [
    "autogen==0.14.1",
]

[project.urls]
Homepage = "https://hyperfocus.zone"
Repository = "https://github.com/welshDog/HyperCode-V2.4"
Issues = "https://github.com/welshDog/HyperCode-V2.4/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pylint]
max-line-length = 120
target-version = "3.12"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=html"

[tool.isort]
profile = "black"
line_length = 120
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
