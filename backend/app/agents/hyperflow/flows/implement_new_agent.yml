# HyperFlow example — "implement a new agent from spec to health-check green"
#
# Wired to REAL crew-orchestrator agents (registered + healthy) so it runs live
# end-to-end:
#   backend_specialist designs the spec  →  human approves  →  coder_agent scaffolds
#   →  qa_engineer verifies health  →  loop until green (bounded)  →  escalate on give-up.
#
# All dispatch nodes are agent_role (the orchestrator /execute keys off `agent`;
# it has no `tool` concept). Each agent call is ~30-60s, so a full run takes a
# couple of minutes. For a fast deterministic smoke, use the `hyperflow-smoke` flow.
#
# Run it:  POST /api/v1/flows/runs {"flow": "implement-new-agent"}
# Watch it: GET  /api/v1/flows/runs/{id}/events   (SSE)
# Approve:  POST /api/v1/flows/runs/{id}/resume   {"approved": true}

name: implement-new-agent
version: 1
entry: design_spec
intent: "Design and scaffold a new agent from a spec, verify health"

nodes:
  - id: design_spec
    type: agent_role
    agent: backend_specialist
    params:
      task: "Design the API surface and responsibilities for a new HyperCode agent from the provided requirements. Output a concise spec."

  - id: approve_spec
    type: human_approval_gate
    params:
      prompt: "Approve the proposed agent spec before scaffolding?"

  - id: scaffold_agent
    type: agent_role
    agent: coder_agent
    params:
      task: "Scaffold the new agent service (FastAPI app, Dockerfile, registry entry) from the approved spec."

  - id: health_probe
    type: agent_role
    agent: qa_engineer
    params:
      task: "Verify the new agent boots and its /health endpoint returns green; report pass/fail."
    success_key: green

  - id: escalate
    type: human_approval_gate
    params:
      prompt: "Health check never went green after retries — human intervention needed."

edges:
  - from: design_spec
    to: approve_spec

  - from: approve_spec
    to: scaffold_agent

  - from: scaffold_agent
    to: health_probe
    retry:
      max: 2
      backoff_seconds: 3.0

  # Not green yet → loop back and re-probe (bounded), else fall through to escalate.
  - from: health_probe
    to: health_probe
    condition: false
    loop:
      max_iterations: 3
    fallback: escalate
