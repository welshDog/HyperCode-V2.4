# docker-compose.memory-limits.yml
# Memory limit overrides for agent containers
# Usage: docker compose -f docker-compose.yml -f docker-compose.memory-limits.yml up -d
#
# This file provides recommended memory limits for all agent containers.
# Copy/merge the relevant sections into your main docker-compose.agents.yml

