services:
  obsidian-sync:
    image: alpine:3.20
    container_name: obsidian-sync
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/obsidian-sync.sh"]
    environment:
      TZ: Europe/London
      OBSIDIAN_REPO_DIR: /workspace/vault
      RESULTS_DIR: /workspace/results
      HANDOVER_DIR: /workspace/rewrites
      DEFAULT_BRANCH: ${DEFAULT_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-BROski Bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-broski-bot@hyperfocus.zone}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-BROski Bot}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-broski-bot@hyperfocus.zone}
      SYNC_MODE: ${SYNC_MODE:-manual}
      SESSION_NOTE_PREFIX: ${SESSION_NOTE_PREFIX:-HYPERAGENT_LOOP}
      SKILL_CATEGORY: ${SKILL_CATEGORY:-agents}
      SKILL_FILE_BASENAME: ${SKILL_FILE_BASENAME:-HYPERAGENTLOOPSYNC}
      SKILL_VERSION: ${SKILL_VERSION:-1}
    volumes:
      - ./:/workspace
      - ./results:/workspace/results
      - ./rewrites:/workspace/rewrites
      # Real Obsidian Brain vault — confirmed path on host
      - /mnt/h/BROski-Obsidian-Brain-for-HyperFocus-z0ne:/workspace/vault
    restart: "no"
    # No network needed — one-shot git sync script.
    # Reads local volume mounts and pushes to GitHub via HTTPS/SSH.
    # BROski♾️
