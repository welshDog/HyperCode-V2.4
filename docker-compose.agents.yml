services:
  # PLACEHOLDER — Agents will be extracted here
  # See COMPLETION_REPORT.md for manual extraction instructions
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=0
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  docker-socket-proxy-healer:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy-healer
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
      - PING=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  healer-agent:
    build:
      context: ./agents
      dockerfile: healer/Dockerfile
    container_name: healer-agent
    restart: always
    ports:
      - "127.0.0.1:8008:8008"
    networks:
      - agents-net
      - data-net
      - obs-net
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      DOCKER_HOST: tcp://docker-socket-proxy-healer:2375
      HYPERCODE_API_KEY: ${API_KEY:-dev-master-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  crew-orchestrator:
    profiles: ["agents"]
    build:
      context: ./agents/crew-orchestrator
      dockerfile: Dockerfile
    container_name: crew-orchestrator
    environment:
      - CORE_URL=http://hypercode-core:8000
      - AGENT_ROLE=crew-orchestrator
      - REDIS_URL=redis://redis:6379
      - ORCHESTRATOR_REDIS_HOST=redis
      - ORCHESTRATOR_REDIS_PORT=6379
      - ORCHESTRATOR_ENABLED_AGENTS=${ORCHESTRATOR_ENABLED_AGENTS:-}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hypercode}
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - HYPERCODE_API_KEY=${API_KEY:-dev-master-key}
      - SMOKE_ENDPOINT_ENABLED=${SMOKE_ENDPOINT_ENABLED:-false}
      - SMOKE_KEY_ALLOWLIST=${SMOKE_KEY_ALLOWLIST:-}
      - SMOKE_KEY_TTL_SECONDS=${SMOKE_KEY_TTL_SECONDS:-900}
    volumes:
      - ./agents/crew-orchestrator:/app
      - ./Configuration_Kit:/app/hive_mind:ro
      - ./agents/shared:/app/shared:ro
      - ./agents/HYPER-AGENT-BIBLE.md:/app/HYPER-AGENT-BIBLE.md:ro
      - agent_memory:/app/memory
    networks:
      - agents-net
      - data-net
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      hypercode-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./agents/dashboard
      dockerfile: Dockerfile
    container_name: hypercode-dashboard
    environment:
      - NEXT_PUBLIC_CORE_URL=http://hypercode-core:8000
      - HYPERCODE_CORE_URL=http://hypercode-core:8000
      - NEXT_PUBLIC_CORE_WS_HOST=localhost
      - NEXT_PUBLIC_CORE_WS_PORT=8000
      - CREW_ORCHESTRATOR_URL=http://crew-orchestrator:8080
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode >= 500) process.exit(1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "127.0.0.1:8088:3000"
    depends_on:
      hypercode-core:
        condition: service_healthy
    networks:
      - frontend-net
      - agents-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  agents-net:
    external: true
    name: hypercode_agents_net

  data-net:
    external: true
    name: hypercode_data_net

  obs-net:
    external: true
    name: hypercode_obs_net

  frontend-net:
    external: true
    name: hypercode_frontend_net
