# docker-compose.agents.yml — All AI agents + apps + infra-side helpers
#
# Always-on (no profile):
#   docker-socket-proxy, docker-socket-proxy-healer, healer-agent,
#   dashboard, hypercode-mcp-server, hypercode-ollama (in core.yml)
#
# Profile-gated services — start with `--profile <name>`:
#   ai            → ai-backend
#   agents        → coder-agent, mcp-gateway, broski-pets-bridge,
#                   crew-orchestrator, goal-keeper, project-strategist,
#                   frontend-specialist, backend-specialist, database-architect,
#                   qa-engineer, devops-engineer, super-hyper-broski-agent,
#                   security-engineer, system-architect, test-agent,
#                   throttle-agent, tips-tricks-writer
#   discord       → broski-bot
#   mission       → hyper-mission-api, hyper-mission-ui
#   hyper         → hyper-architect, hyper-observer, hyper-worker,
#                   hyper-split-agent, session-snapshot, agent-x,
#                   docker-socket-proxy-build (also ops/health)
#   health        → hyperhealth-api, hyperhealth-worker, auto-prune,
#                   security-scanner, docker-socket-proxy-build
#   ops           → auto-prune, security-scanner, docker-socket-proxy-build
#   gpu           → hypercode-ollama-gpu (replaces hypercode-ollama)
#   disabled      → docker-janitor (kept for reference)

services:
  # ====================================================================
  # ALWAYS-ON CORE AGENT INFRA
  # ====================================================================

  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=0
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  # Dedicated write-enabled proxy — ONLY for healer + throttle-agent.
  # Scoped tight: CONTAINERS + POST + PING only.
  docker-socket-proxy-healer:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy-healer
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
      - PING=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  docker-socket-proxy-build:
    profiles: ["ops", "health", "hyper"]
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy-build
    restart: unless-stopped
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=1
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  healer-agent:
    build:
      context: ./agents
      dockerfile: healer/Dockerfile
    container_name: healer-agent
    restart: always
    ports:
      - "127.0.0.1:8008:8008"
    networks:
      - agents-net
      - data-net
      - obs-net
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      DOCKER_HOST: tcp://docker-socket-proxy-healer:2375
      HYPERCODE_API_KEY: ${API_KEY:-dev-master-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      DISCORD_OOM_WEBHOOK_URL: ${DISCORD_OOM_WEBHOOK_URL:-}
      DISCORD_ALERTS_WEBHOOK_URL: ${DISCORD_ALERTS_WEBHOOK_URL:-}
      RESTART_LOOP_THRESHOLD: ${RESTART_LOOP_THRESHOLD:-5}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  hypercode-mcp-server:
    build:
      context: ./services/hypercode-mcp-server
      dockerfile: Dockerfile
    container_name: hypercode-mcp-server
    environment:
      - HYPERCODE_CORE_URL=http://hypercode-core:8000
      - HYPERCODE_ORCH_URL=http://crew-orchestrator:8080
    networks:
      - agents-net
      - frontend-net
    ports:
      - "127.0.0.1:8823:8823"
    depends_on:
      hypercode-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8823/sse')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./agents/dashboard
      dockerfile: Dockerfile
    container_name: hypercode-dashboard
    environment:
      - NEXT_PUBLIC_CORE_URL=http://hypercode-core:8000
      - HYPERCODE_CORE_URL=http://hypercode-core:8000
      - NEXT_PUBLIC_CORE_WS_HOST=localhost
      - NEXT_PUBLIC_CORE_WS_PORT=8000
      - CREW_ORCHESTRATOR_URL=http://crew-orchestrator:8080
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode >= 500) process.exit(1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "127.0.0.1:8088:3000"
    depends_on:
      hypercode-core:
        condition: service_healthy
    networks:
      - frontend-net
      - agents-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ====================================================================
  # GPU OLLAMA — replaces hypercode-ollama (core.yml) when --profile gpu
  # ====================================================================

  hypercode-ollama-gpu:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.14}
    profiles: ["gpu"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      agents-net:
        aliases:
          - hypercode-ollama
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ====================================================================
  # AI BACKEND (heavy AI deps) — `--profile ai`
  # ====================================================================

  ai-backend:
    profiles: ["ai"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_AI_DEPS: "true"
    image: ${HYPERCODE_AI_IMAGE:-hypercode-ai:latest}
    container_name: ai-backend
    environment:
      - ENVIRONMENT=development
      - PRISMA_PY_DEBUG=0
      - HYPERCODE_REDIS_URL=${HYPERCODE_REDIS_URL}
      - HYPERCODE_DB_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      - HYPERCODE_MEMORY_KEY=${HYPERCODE_MEMORY_KEY}
      - API_KEY=${API_KEY}
      - HYPERCODE_JWT_SECRET=${HYPERCODE_JWT_SECRET}
      - JWT_SECRET=${HYPERCODE_JWT_SECRET}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - CREW_ORCHESTRATOR_URL=http://crew-orchestrator:8080
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_BUILDER=${STRIPE_PRICE_BUILDER:-}
      - STRIPE_PRICE_HYPER=${STRIPE_PRICE_HYPER:-}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY:-}
      - STRIPE_PRICE_HYPER_MONTHLY=${STRIPE_PRICE_HYPER_MONTHLY:-}
      - STRIPE_PRICE_HYPER_YEARLY=${STRIPE_PRICE_HYPER_YEARLY:-}
      - OLLAMA_HOST=http://hypercode-ollama:11434
      - DEFAULT_LLM_MODEL=auto
      - OTLP_EXPORTER_DISABLED=${OTLP_EXPORTER_DISABLED}
      - OTLP_ENDPOINT=http://tempo:4317
      - PROMETHEUS_METRICS_DISABLED=false
      - DB_AUTO_CREATE=true
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:3000,http://127.0.0.1:3000}
    env_file:
      - .env
    volumes:
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hypercode-ollama:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
      - agents-net
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================================================
  # OPS / HEALTH — auto-prune, security-scanner, docker-janitor
  # ====================================================================

  auto-prune:
    profiles: ["ops", "health"]
    image: ${DOCKER_CLI_IMAGE:-docker:27.3.1-cli}
    container_name: hyper-sweeper-prune
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy-build:2375
    command: >
      sh -c "echo '0 * * * * docker container prune -f && docker image prune -f --filter until=48h && docker builder prune -f --keep-storage=5gb' > /etc/crontabs/root && crond -f"
    restart: unless-stopped
    networks:
      - agents-net
    depends_on:
      docker-socket-proxy-build:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  security-scanner:
    profiles: ["ops", "health"]
    image: ${TRIVY_IMAGE:-aquasec/trivy:0.56.2}
    container_name: hyper-shield-scanner
    entrypoint: ["/bin/sh", "-c", "while true; do trivy image --exit-code 0 --severity HIGH,CRITICAL --format json -o /reports/trivy-hypercode-core.json hypercode-core:latest; sleep 86400; done"]
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy-build:2375
    volumes:
      - ./reports/security:/reports
      - trivy-cache:/root/.cache/trivy
    networks:
      - agents-net
    restart: unless-stopped
    depends_on:
      docker-socket-proxy-build:
        condition: service_started
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M

  docker-janitor:
    profiles: ["disabled"]
    image: meltwater/docker-cleanup:latest
    container_name: docker-janitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CLEAN_PERIOD=1800
      - DELAY_TIME=600
      - KEEP_IMAGES=true
      - KEEP_CONTAINERS=true
      - CLEAN_STOPPED_CONTAINERS=false
      - CLEAN_UNUSED_IMAGES=false
      - CLEAN_UNUSED_VOLUMES=false

  # ====================================================================
  # CORE AGENTS — `--profile agents`
  # ====================================================================

  crew-orchestrator:
    profiles: ["agents"]
    build:
      context: ./agents/crew-orchestrator
      dockerfile: Dockerfile
    container_name: crew-orchestrator
    environment:
      - CORE_URL=http://hypercode-core:8000
      - AGENT_ROLE=crew-orchestrator
      - REDIS_URL=redis://redis:6379
      - ORCHESTRATOR_REDIS_HOST=redis
      - ORCHESTRATOR_REDIS_PORT=6379
      - ORCHESTRATOR_ENABLED_AGENTS=${ORCHESTRATOR_ENABLED_AGENTS:-}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hypercode}
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - HYPERCODE_API_KEY=${API_KEY:-dev-master-key}
      - SMOKE_ENDPOINT_ENABLED=${SMOKE_ENDPOINT_ENABLED:-false}
      - SMOKE_KEY_ALLOWLIST=${SMOKE_KEY_ALLOWLIST:-}
      - SMOKE_KEY_TTL_SECONDS=${SMOKE_KEY_TTL_SECONDS:-900}
    volumes:
      - ./agents/crew-orchestrator:/app
      - ./Configuration_Kit:/app/hive_mind:ro
      - ./agents/shared:/app/shared:ro
      - ./agents/HYPER-AGENT-BIBLE.md:/app/HYPER-AGENT-BIBLE.md:ro
      - agent_memory:/app/memory
    networks:
      - agents-net
      - data-net
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      hypercode-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  coder-agent:
    profiles: ["agents"]
    build:
      context: ./agents/coder
      dockerfile: Dockerfile
    container_name: coder-agent
    environment:
      - CORE_URL=http://hypercode-core:8000
      - PROMETHEUS_URL=http://prometheus:9090
      - HYPERCODE_API_KEY=${API_KEY:-dev-master-key}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OLLAMA_URL=http://hypercode-ollama:11434/api/generate
      - OLLAMA_MODEL=${CODER_OLLAMA_MODEL:-qwen2.5:3b}
      - AGENT_PORT=8002
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./agents/coder/workspace:/workspace
      - ./agents/base-agent/agent.py:/app/base_agent.py:ro
      - ./Configuration_Kit:/app/hive_mind:ro
      - ./agents/shared:/app/shared:ro
      - ./agents/HYPER-AGENT-BIBLE.md:/app/HYPER-AGENT-BIBLE.md:ro
      - agent_memory:/app/memory
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - agents-net
    depends_on:
      hypercode-core:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mcp-gateway:
    profiles: ["agents"]
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    command:
      - --servers=github
      - --transport=streaming
      - --port=8820
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
    expose:
      - "8820"
    ports:
      - "127.0.0.1:8820:8820"
    networks:
      - agents-net
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8820/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  broski-pets-bridge:
    profiles: ["agents"]
    build:
      context: ./agents/broski-pets-bridge
      dockerfile: Dockerfile
    container_name: broski-pets-bridge
    environment:
      - PORT=8098
      - PETS_ENABLED=${BROSKIE_PETS_ENABLED:-false}
      - REDIS_URL=redis://redis:6379/3
      - OLLAMA_URL=http://hypercode-ollama:11434
      - PETS_OLLAMA_MODEL=${PETS_OLLAMA_MODEL:-qwen2.5:7b}
      - PETS_NUM_PREDICT=${PETS_NUM_PREDICT:-80}
      - WORKSPACE_PATH=/workspace
      - SQUAD_JSON_PATH=/workspace/squad.json
      - MCP_GATEWAY_URL=${MCP_GATEWAY_URL:-http://mcp-gateway:8820}
      - PETS_WEBHOOK_SECRET=${PETS_WEBHOOK_SECRET:-}
      - COURSE_SYNC_SECRET=${COURSE_SYNC_SECRET:-}
      - HYPERCODE_API_KEY=${API_KEY:-dev-master-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - PETS_LLM_PROVIDER=${PETS_LLM_PROVIDER:-anthropic}
      - PETS_ANTHROPIC_MODEL_CHAT=${PETS_ANTHROPIC_MODEL_CHAT:-claude-haiku-4-5-20251001}
      - PETS_ANTHROPIC_MODEL_ASK=${PETS_ANTHROPIC_MODEL_ASK:-claude-sonnet-4-6}
      - PETS_ANTHROPIC_MAX_TOKENS=${PETS_ANTHROPIC_MAX_TOKENS:-300}
      - PETS_ANTHROPIC_FALLBACK_OLLAMA=${PETS_ANTHROPIC_FALLBACK_OLLAMA:-true}
    volumes:
      - .:/workspace:ro
    ports:
      - "127.0.0.1:8098:8098"
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      hypercode-ollama:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  goal-keeper:
    profiles: ["agents", "goal-keeper"]
    build:
      context: ./agents/goal_keeper
      dockerfile: Dockerfile
    container_name: goal-keeper
    environment:
      - AGENT_NAME=goal-keeper
      - AGENT_PORT=8050
      - CORE_URL=http://hypercode-core:8000
      - REDIS_URL=redis://redis:6379
      - GOAL_KEEPER_API_KEY=${GOAL_KEEPER_API_KEY:-}
