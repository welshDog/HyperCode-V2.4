      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================================================
  # OPS / HEALTH — auto-prune, security-scanner, docker-janitor
  # ====================================================================

  auto-prune:
    profiles: ["ops", "health"]
    image: ${DOCKER_CLI_IMAGE:-docker:27.3.1-cli}
    container_name: hyper-sweeper-prune
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy-build:2375
    command: >
      sh -c "echo '0 * * * * docker container prune -f && docker image prune -f --filter until=48h && docker builder prune -f --keep-storage=5gb' > /etc/crontabs/root && crond -f"
    restart: unless-stopped
    networks:
      - agents-net
    depends_on:
      docker-socket-proxy-build:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  security-scanner:
    profiles: ["ops", "health"]
    image: ${TRIVY_IMAGE:-aquasec/trivy:0.56.2}
    container_name: hyper-shield-scanner
    entrypoint: ["/bin/sh", "-c", "while true; do trivy image --exit-code 0 --severity HIGH,CRITICAL --format json -o /reports/trivy-hypercode-core.json hypercode-core:latest; sleep 86400; done"]
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy-build:2375
    volumes:
      - ./reports/security:/reports
      - trivy-cache:/root/.cache/trivy
    networks:
      - agents-net
    restart: unless-stopped
    depends_on:
      docker-socket-proxy-build:
        condition: service_started
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M

  docker-janitor:
    profiles: ["disabled"]
    image: meltwater/docker-cleanup:latest
    container_name: docker-janitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CLEAN_PERIOD=1800
      - DELAY_TIME=600
      - KEEP_IMAGES=true
      - KEEP_CONTAINERS=true
      - CLEAN_STOPPED_CONTAINERS=false
      - CLEAN_UNUSED_IMAGES=false
      - CLEAN_UNUSED_VOLUMES=false

