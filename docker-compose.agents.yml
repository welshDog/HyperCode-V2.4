# docker-compose.agents.yml — All AI agents + apps + infra-side helpers
#
# Always-on (no profile):
#   docker-socket-proxy, docker-socket-proxy-healer, healer-agent,
#   dashboard, hypercode-mcp-server, hypercode-ollama (in core.yml),
#   github-sync
#
# Profile-gated services — start with `--profile <name>`:
#   ai            → ai-backend
#   agents        → coder-agent, mcp-gateway, broski-pets-bridge,
#                   crew-orchestrator, goal-keeper, project-strategist,
#                   frontend-specialist, backend-specialist, database-architect,
#                   qa-engineer, devops-engineer, super-hyper-broski-agent,
#                   security-engineer, system-architect, test-agent,
#                   throttle-agent, tips-tricks-writer
#   discord       → broski-bot
#   mission       → hyper-mission-api, hyper-mission-ui
#   hyper         → hyper-architect, hyper-observer, hyper-worker,
#                   hyper-split-agent, session-snapshot, agent-x,
#                   docker-socket-proxy-build (also ops/health)
#   health        → hyperhealth-api, hyperhealth-worker, auto-prune,
#                   security-scanner, docker-socket-proxy-build
#   ops           → auto-prune, security-scanner, docker-socket-proxy-build
#   gpu           → hypercode-ollama-gpu (replaces hypercode-ollama)
#   disabled      → docker-janitor (kept for reference)

services:
  # ====================================================================
  # ALWAYS-ON CORE AGENT INFRA
  # ====================================================================

  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=0
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  # Dedicated write-enabled proxy — ONLY for healer + throttle-agent.
  # Scoped tight: CONTAINERS + POST + PING only.
  docker-socket-proxy-healer:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy-healer
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
      - PING=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true

  docker-socket-proxy-build:
    profiles: ["ops", "health", "hyper"]
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.1}
    container_name: docker-socket-proxy-build
    restart: unless-stopped
    networks:
      - agents-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=1
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run
      - /var/lib/haproxy
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  healer-agent:
    build:
      context: ./agents
      dockerfile: healer/Dockerfile
    container_name: healer-agent
    restart: always
    ports:
      - "127.0.0.1:8008:8008"
    networks:
      - agents-net
      - data-net
      - obs-net
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      DOCKER_HOST: tcp://docker-socket-proxy-healer:2375
      HYPERCODE_API_KEY: ${API_KEY:-dev-master-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      DISCORD_OOM_WEBHOOK_URL: ${DISCORD_OOM_WEBHOOK_URL:-}
      DISCORD_ALERTS_WEBHOOK_URL: ${DISCORD_ALERTS_WEBHOOK_URL:-}
      RESTART_LOOP_THRESHOLD: ${RESTART_LOOP_THRESHOLD:-5}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  hypercode-mcp-server:
    build:
      context: ./services/hypercode-mcp-server
      dockerfile: Dockerfile
    container_name: hypercode-mcp-server
    environment:
      - HYPERCODE_CORE_URL=http://hypercode-core:8000
      - HYPERCODE_ORCH_URL=http://crew-orchestrator:8080
    networks:
      - agents-net
      - frontend-net
    ports:
      - "127.0.0.1:8823:8823"
    depends_on:
      hypercode-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8823/sse')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./agents/dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_HYPER_BRAIN_URL=${NEXT_PUBLIC_HYPER_BRAIN_URL:-}
    container_name: hypercode-dashboard
    environment:
      - NEXT_PUBLIC_CORE_URL=http://hypercode-core:8000
      - HYPERCODE_CORE_URL=http://hypercode-core:8000
      - NEXT_PUBLIC_CORE_WS_HOST=localhost
      - NEXT_PUBLIC_CORE_WS_PORT=8000
      - CREW_ORCHESTRATOR_URL=http://crew-orchestrator:8080
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode >= 500) process.exit(1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "127.0.0.1:8088:3000"
    depends_on:
      hypercode-core:
        condition: service_healthy
    networks:
      - frontend-net
      - agents-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ====================================================================
  # GITHUB SYNC — always-on, no profile
  # Runs github_to_obsidian.py every 4 hours via cron
  # Healthcheck: verify cron process is alive (not HTTP — cron has no port)
  # BROski♾️
  # ====================================================================

  github-sync:
    build:
      context: .
      dockerfile: Dockerfile.github-sync
    container_name: github-sync
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - github-sync-logs:/var/log
    networks:
      - agents-net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep cron || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true

  # ====================================================================
  # MISSION (profile: mission)
  # ====================================================================

  hyper-mission-api:
    profiles: ["mission"]
    build:
      context: ./hyper-mission-system/server
      dockerfile: Dockerfile
    container_name: hyper-mission-api
    restart: unless-stopped
    environment:
      PORT: "5000"
      CORE_API_URL: http://hypercode-core:8000
      AUTH_PASSTHROUGH: "true"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      JWT_SECRET: ${HYPERCODE_JWT_SECRET:-dev-jwt-secret}
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - agents-net
      - data-net
    depends_on:
      hypercode-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  hyper-mission-ui:
    profiles: ["mission"]
    build:
      context: ./hyper-mission-system/client
      dockerfile: Dockerfile
    container_name: hyper-mission-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:80"
    networks:
      - frontend-net
      - agents-net
    depends_on:
      hyper-mission-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  hyperhealth-api:
    profiles: ["health"]
    build:
      context: ./agents/hyperhealth
      dockerfile: Dockerfile
    image: hypercode-v20-hyperhealth-api
    container_name: hyperhealth-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-hypercode}
      - REDIS_URL=redis://redis:6379/0
      - HEALER_URL=http://healer-agent:8008
      - CORE_URL=http://hypercode-core:8000
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - CREW_URL=http://crew-orchestrator:8080
      - API_KEY=${API_KEY:?API_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PD_ROUTING_KEY=${PD_ROUTING_KEY:-}
    volumes:
      - ./agents/shared:/app/shared:ro
    networks:
      - backend-net
      - data-net
      - agents-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hypercode-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "hypercode.service=hyperhealth-api"
      - "hypercode.role=health-orchestrator"

  hyperhealth-worker:
    profiles: ["health"]
    build:
      context: ./agents/hyperhealth
      dockerfile: Dockerfile
    image: hypercode-v20-hyperhealth-worker
    container_name: hyperhealth-worker
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-hypercode}
      - REDIS_URL=redis://redis:6379/0
      - HEALER_URL=http://healer-agent:8008
      - CORE_URL=http://hypercode-core:8000
      - API_KEY=${API_KEY:?API_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - WORKER_CONCURRENCY=50
      - CHECK_BATCH_SIZE=100
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PD_ROUTING_KEY=${PD_ROUTING_KEY:-}
    volumes:
      - ./agents/shared:/app/shared:ro
    networks:
      - backend-net
      - data-net
      - agents-net
    depends_on:
      hyperhealth-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import redis, sys
          r = redis.from_url('redis://redis:6379/0', socket_timeout=5)
          val = r.get('hyperhealth:worker:heartbeat')
          sys.exit(0 if val else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "hypercode.service=hyperhealth-worker"
      - "hypercode.role=check-executor"

  hyper-architect:
    profiles: ["hyper"]
    build:
      context: .
      dockerfile: agents/hyper-agents/architect/Dockerfile
    container_name: hyper-architect
    hostname: hyper-architect
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      AGENT_NAME: lead-architect-01
      AGENT_PORT: "8091"
      CREW_ORCHESTRATOR_URL: http://crew-orchestrator:8080
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
    volumes:
      - ./agents/shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      hypercode.agent: "true"
      hypercode.archetype: "architect"
      hypercode.version: "2.0"

  hyper-observer:
    profiles: ["hyper"]
    build:
      context: .
      dockerfile: agents/hyper-agents/observer/Dockerfile
    container_name: hyper-observer
    hostname: hyper-observer
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      AGENT_NAME: sys-observer-01
      AGENT_PORT: "8092"
      CREW_ORCHESTRATOR_URL: http://crew-orchestrator:8080
      REDIS_URL: redis://redis:6379
      OBSERVER_WINDOW_SIZE: "200"
    volumes:
      - ./agents/shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      hypercode.agent: "true"
      hypercode.archetype: "observer"
      hypercode.version: "2.0"

  hyper-worker:
    profiles: ["hyper"]
    build:
      context: .
      dockerfile: agents/hyper-agents/worker/Dockerfile
    container_name: hyper-worker
    hostname: hyper-worker
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      AGENT_NAME: task-worker-01
      AGENT_PORT: "8093"
      CREW_ORCHESTRATOR_URL: http://crew-orchestrator:8080
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      HYPERFOCUS_MODE: "false"
    volumes:
      - ./agents/shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      hypercode.agent: "true"
      hypercode.archetype: "worker"
      hypercode.version: "2.0"

  agent-x:
    profiles: ["hyper"]
    build:
      context: .
      dockerfile: agents/agent-x/Dockerfile
    container_name: agent-x
    hostname: agent-x
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      AGENT_NAME: agent-x-01
      AGENT_PORT: "8080"
      CREW_ORCHESTRATOR_URL: http://crew-orchestrator:8080
      OLLAMA_HOST: http://hypercode-ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      DOCKER_HOST: tcp://docker-socket-proxy-build:2375
      WORKSPACE_PATH: /workspace
      HYPER_AGENTS_COMPOSE: /workspace/docker-compose.hyper-agents.yml
      AGENTS_COMPOSE: /workspace/docker-compose.agents.yml
      OBSERVER_URL: http://hyper-observer:8092
      WORKER_URL: http://hyper-worker:8093
      ARCHITECT_URL: http://hyper-architect:8091
      AGENT_HEALTH_THRESHOLD: "60"
      LLM_TIMEOUT_SECONDS: "120"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - agents-net
      - data-net
    depends_on:
      hyper-architect:
        condition: service_healthy
      hyper-observer:
        condition: service_healthy
      hyper-worker:
        condition: service_healthy
      docker-socket-proxy-build:
        condition: service_started

  # ====================================================================
  # GPU OLLAMA — replaces hypercode-ollama (core.yml) when --profile gpu
  # ====================================================================

  hypercode-ollama-gpu:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.14}
    profiles: ["gpu"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      agents-net:
        aliases:
          - hypercode-ollama
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ====================================================================
  # AI BACKEND (heavy AI deps) — `--profile ai`
  # ====================================================================

  ai-backend:
    profiles: ["ai"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_AI_DEPS: "true"
    image: ${HYPERCODE_AI_IMAGE:-hypercode-ai:latest}
    container_name: ai-backend
    environment:
      - ENVIRONMENT=development
      - PRISMA_PY_DEBUG=0
      - HYPERCODE_REDIS_URL=${HYPERCODE_REDIS_URL}
      - HYPERCODE_DB_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hypercode}@postgres:5432/${POSTGRES_DB:-hypercode}
      - HYPERCODE_MEMORY_KEY=${HYPERCODE_MEMORY_KEY}
      - API_KEY=${API_KEY}
      - HYPERCODE_JWT_SECRET=${HYPERCODE_JWT_SECRET}
      - JWT_SECRET=${HYPERCODE_JWT_SECRET}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - CREW_ORCHESTRATOR_URL=http://crew-orchestrator:8080
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_BUILDER=${STRIPE_PRICE_BUILDER:-}
      - STRIPE_PRICE_HYPER=${STRIPE_PRICE_HYPER:-}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY:-}
      - STRIPE_PRICE_HYPER_MONTHLY=${STRIPE_PRICE_HYPER_MONTHLY:-}
      - STRIPE_PRICE_HYPER_YEARLY=${STRIPE_PRICE_HYPER_YEARLY:-}
      - OLLAMA_HOST=http://hypercode-ollama:11434
      - DEFAULT_LLM_MODEL=auto
      - OTLP_EXPORTER_DISABLED=${OTLP_EXPORTER_DISABLED}
      - OTLP_ENDPOINT=http://tempo:4317
      - PROMETHEUS_METRICS_DISABLED=false
      - DB_AUTO_CREATE=true
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:3000,http://127.0.0.1:3000}
