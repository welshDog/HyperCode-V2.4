version: '3.9'

# ========================================
# Development Compose Override File
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Features: Hot reload, faster rebuilds, debug logging
# ========================================

services:
  hypercode-core:
    # Enable hot reload for backend development
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/app
        - path: ./backend/requirements.txt
          action: rebuild

  backend-specialist:
    develop:
      watch:
        - path: ./agents/02-backend-specialist
          action: sync
          target: /app
        - path: ./agents/shared
          action: sync
          target: /app/shared

  frontend-specialist:
    develop:
      watch:
        - path: ./agents/01-frontend-specialist
          action: sync
          target: /app
        - path: ./agents/shared
          action: sync
          target: /app/shared

  database-architect:
    develop:
      watch:
        - path: ./agents/03-database-architect
          action: sync
          target: /app
        - path: ./agents/shared
          action: sync
          target: /app/shared

  qa-engineer:
    develop:
      watch:
        - path: ./agents/04-qa-engineer
          action: sync
          target: /app
        - path: ./agents/shared
          action: sync
          target: /app/shared

  devops-engineer:
    develop:
      watch:
        - path: ./agents/05-devops-engineer
          action: sync
          target: /app
        - path: ./agents/shared
          action: sync
          target: /app/shared

  dashboard:
    develop:
      watch:
        - path: ./agents/dashboard
          action: rebuild

  # Enable debug logging for all services
  hypercode-core:
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  hypercode-ollama:
    environment:
      - OLLAMA_DEBUG=1
