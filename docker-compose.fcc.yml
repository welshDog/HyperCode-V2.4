# ============================================================
# docker-compose.fcc.yml — Free Claude Code (FCC) Proxy
# Source: github.com/Alishahryar1/free-claude-code (42k ⭐)
# Port: 8083 (8082 was taken by brain-agent — PORT_MAP_COMPLETE.md was stale)
# Network: hypercode_agents_net (existing — verified via docker inspect)
# Build: local Dockerfile.fcc clones FCC + installs via uv
# ============================================================

services:
  fcc-proxy:
    build:
      context: .
      dockerfile: Dockerfile.fcc
    image: fcc-proxy:local
    container_name: fcc-proxy
    restart: unless-stopped

    ports:
      - "127.0.0.1:8083:8083"

    environment:
      HOST: "0.0.0.0"
      PORT: "8083"
      FCC_OPEN_BROWSER: "0"
      OLLAMA_BASE_URL: "http://hypercode-ollama:11434"
      MODEL: "${MODEL:-nvidia_nim/nvidia/nemotron-3-super-120b-a12b}"
      NVIDIA_NIM_API_KEY: "${NVIDIA_NIM_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-freecc}"
      MESSAGING_PLATFORM: "${MESSAGING_PLATFORM:-none}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      ALLOWED_DISCORD_CHANNELS: "${ALLOWED_DISCORD_CHANNELS:-}"
      ALLOWED_DIR: "${ALLOWED_DIR:-/workspace}"

    volumes:
      - fcc-config:/root/.fcc

    networks:
      - agents-net

    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"x-api-key: $ANTHROPIC_AUTH_TOKEN\" http://localhost:8083/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    labels:
      com.hypercode.service: "fcc-proxy"
      com.hypercode.port: "8083"
      com.hypercode.description: "Free Claude Code proxy — Ollama + NIM + OpenRouter"

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 128M

volumes:
  fcc-config:
    name: hypercode_fcc-config

networks:
  agents-net:
    external: true
    name: hypercode_agents_net
