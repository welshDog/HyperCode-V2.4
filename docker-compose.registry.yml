# docker-compose.registry.yml — Agent Registry + newly finished agents
#
# Run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml \
#     -f docker-compose.agents.yml -f docker-compose.registry.yml up -d agent-registry
#
# Services:
#   agent-registry        (always-on)      — fleet tracker, /agents/status, auto-restart
#   agent-factory         (profile agents) — REST spawn/wake for profile-gated agents
#   hyper-auto-assistant  (profile hyper)  — intent router → super-hyper-broski-agent
#   broski-coo            (profile agents) — read-only COO brief, /brief (port 8025)

services:
  agent-registry:
    build:
      context: ./agents/agent-registry
      dockerfile: Dockerfile
    container_name: agent-registry
    restart: unless-stopped
    networks:
      - agents-net
      - data-net
    ports:
      - "127.0.0.1:8077:8077"
    environment:
      - DOCKER_READ_HOST=http://docker-socket-proxy:2375
      - DOCKER_WRITE_HOST=http://docker-socket-proxy-healer:2375
      - REDIS_URL=redis://redis:6379
      - POLL_INTERVAL_SECONDS=30
      - CRASH_WINDOW_SECONDS=600
      - CRASH_THRESHOLD=3
      - RESTART_COOLDOWN_SECONDS=60
      - CIRCUIT_BREAK_SECONDS=600
      - AUTO_RESTART_ENABLED=true
      - DISCORD_WEBHOOK_URL=${REGISTRY_DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8077/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  agent-factory:
    profiles: ["agents"]
    build:
      context: ./agents/agent-factory
      dockerfile: Dockerfile
    container_name: agent-factory
    restart: unless-stopped
    networks:
      - agents-net
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SPAWN_MODE=docker
      - DOCKER_READ_HOST=http://docker-socket-proxy:2375
      - DOCKER_WRITE_HOST=http://docker-socket-proxy-healer:2375
    volumes:
      # Shared loadout module + HYPER-SILLs loadout/registry for the startup
      # boot-check. Fail-open if absent. Override base via HYPER_SILLS_PATH.
      - ./agents/shared:/app/shared:ro
      - ${HYPER_SILLS_PATH:-../HYPER-SILLs-By-WelshDog}/agent-loadouts.json:/skills/agent-loadouts.json:ro
      - ${HYPER_SILLS_PATH:-../HYPER-SILLs-By-WelshDog}/skills-registry.json:/skills/skills-registry.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  hyper-auto-assistant:
    profiles: ["hyper"]
    build:
      context: ./agents/hyper-auto-assistant
      dockerfile: Dockerfile
    container_name: hyper-auto-assistant
    restart: unless-stopped
    networks:
      - agents-net
    ports:
      - "127.0.0.1:8016:8016"
    environment:
      - BROSKI_AGENT_URL=http://super-hyper-broski-agent:8015
      - PORT=8016
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  broski-coo:
    profiles: ["agents"]
    build:
      context: ./agents/broski-coo
      dockerfile: Dockerfile
    container_name: broski-coo
    restart: unless-stopped
    networks:
      - agents-net
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      - AGENT_REGISTRY_URL=http://agent-registry:8077
      - REPO_ROOT_PATH=/app/repo
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_PRESET=${OPENROUTER_PRESET:-free-router}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - LLM_API_BASE=${LLM_API_BASE:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-NA}
      - HYPERCODE_API_KEY=${HYPERCODE_API_KEY:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
    volumes:
      - ./:/app/repo:ro
    depends_on:
      agent-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  agents-net:
    external: true
  data-net:
    external: true
