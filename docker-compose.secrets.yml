# 🗝️ Phase 10C — Docker Secrets Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# All secret values live in ./secrets/*.txt — NEVER in .env
#
# ⚠️ EXCLUSIVE CONFLICT RULE:
# Grafana: GF_SECURITY_ADMIN_PASSWORD + GF_SECURITY_ADMIN_PASSWORD__FILE are exclusive
# Postgres: POSTGRES_PASSWORD + POSTGRES_PASSWORD_FILE are exclusive
# Solution: Both use plain env var from .env ONLY — no _FILE override here

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  api_key:
    file: ./secrets/api_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  discord_token:
    file: ./secrets/discord_token.txt
  orchestrator_api_key:
    file: ./secrets/orchestrator_api_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  memory_key:
    file: ./secrets/memory_key.txt

  # Phase 10E (REAL, 2026-06-12): per-agent keys are minted into core's
  # agent_api_keys table (scripts/mint_agent_keys.py) and the raw values
  # live in ./secrets/agent_api_key_*.txt. Re-add a secret here ONLY when
  # the agent actually reads it (env-or-file) and sends X-Agent-Key on
  # agent->core calls. Pilot: crew-orchestrator.
  agent_api_key_crew-orchestrator:
    file: ./secrets/agent_api_key_crew-orchestrator.txt
  agent_api_key_nemoclaw-agent:
    file: ./secrets/agent_api_key_nemoclaw-agent.txt
  agent_api_key_broski-pets-bridge:
    file: ./secrets/agent_api_key_broski-pets-bridge.txt
  agent_api_key_healer-agent:
    file: ./secrets/agent_api_key_healer-agent.txt
  agent_api_key_coder-agent:
    file: ./secrets/agent_api_key_coder-agent.txt
  agent_api_key_throttle-agent:
    file: ./secrets/agent_api_key_throttle-agent.txt
  agent_api_key_tips-tricks-writer:
    file: ./secrets/agent_api_key_tips-tricks-writer.txt
  agent_api_key_safety-shepherd:
    file: ./secrets/agent_api_key_safety-shepherd.txt
  agent_api_key_governor:
    file: ./secrets/agent_api_key_governor.txt

  # Phase 2 (Governor + Capability Tokens) — Ed25519 capability-signing key.
  # Generated by scripts/gen_governor_keypair.py into ./secrets/ (gitignored).
  # governor holds the ONLY private key; every other agent gets the public
  # key baked into its image for verification only.
  governor_ed25519_private_key:
    file: ./secrets/governor_ed25519_private_key.txt

  # Phase 2 fix wave (2026-09-05) — dedicated operator/approval credential.
  # governor's /v1/kill, /v1/unkill, /v1/approvals (POST) and
  # GET /v1/approvals/{mission_id} all authenticate against this key. It
  # MUST NOT be the shared `api_key` secret (also held by hypercode-core,
  # broski-bot — an LLM-driven Discord bot, hyperhealth-api,
  # hyperhealth-worker): once /v1/approvals requires this key, holding it
  # is equivalent to being a valid two-person approver, so a secret shared
  # with an LLM-driven or otherwise untrusted-input-interpreting service
  # would let it single-handedly satisfy the two-person rule.
  governor_operator_key:
    file: ./secrets/governor_operator_key.txt

services:

  # ✅ postgres — plain POSTGRES_PASSWORD from .env only (no _FILE)
  # ✅ grafana — plain GF_SECURITY_ADMIN_PASSWORD from .env only (no __FILE)
  # Both services treat their password vars as exclusive — only one can be set!

  hypercode-core:
    environment:
      HYPERCODE_REDIS_URL: ${HYPERCODE_REDIS_URL}
      HYPERCODE_MEMORY_KEY_FILE: /run/secrets/memory_key
      API_KEY_FILE: /run/secrets/api_key
      HYPERCODE_JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      ORCHESTRATOR_API_KEY_FILE: /run/secrets/orchestrator_api_key
    secrets:
      - api_key
      - jwt_secret
      - memory_key
      - anthropic_api_key
      - orchestrator_api_key

  broski-bot:
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      BOT_API_KEY_FILE: /run/secrets/api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - discord_token
      - api_key
      - openai_api_key
      - postgres_password

  # grafana — NO override needed here, uses GF_SECURITY_ADMIN_PASSWORD from .env

  minio:
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password

  crew-orchestrator:
    environment:
      ORCHESTRATOR_API_KEY_FILE: /run/secrets/orchestrator_api_key
      # Phase 10E identity — code reads the file itself (env-or-file)
      HYPERCODE_AGENT_KEY_FILE: /run/secrets/agent_api_key_crew-orchestrator
    secrets:
      - orchestrator_api_key
      - agent_api_key_crew-orchestrator

  safety-shepherd:
    environment:
      # HS-P2c — governance-ledger verdict pushes to core (env-or-file)
      CORE_AGENT_KEY_FILE: /run/secrets/agent_api_key_safety-shepherd
    secrets:
      - agent_api_key_safety-shepherd

  # Phase 2 (Governor + Capability Tokens) — behind --profile fleet, see
  # docker-compose.fleet.yml. governor_ed25519_private_key is the ONLY
  # capability-signing key in the whole fleet. agent_api_key_governor lets
  # governor's ledger-write path (Task 11) authenticate to core the same way
  # every other agent does — provision it with scripts/mint_agent_keys.py
  # BEFORE `docker compose up` with this file applied: unlike an env var,
  # a Docker file-secret whose source file doesn't exist fails `up` hard
  # (not a soft no-op) — `config` validation does not catch this, it never
  # reads secret file contents.
  governor:
    profiles: ["fleet"]
    environment:
      CORE_AGENT_KEY_FILE: /run/secrets/agent_api_key_governor
    secrets:
      - governor_ed25519_private_key
      - agent_api_key_governor
      - governor_operator_key

  nemoclaw-agent:
    environment:
      # Phase 10E identity — code reads the file itself (env-or-file)
      HYPERCODE_AGENT_KEY_FILE: /run/secrets/agent_api_key_nemoclaw-agent
    secrets:
      - agent_api_key_nemoclaw-agent

  broski-pets-bridge:
    environment:
      # Phase 10E identity — code reads the file itself (env-or-file)
      HYPERCODE_AGENT_KEY_FILE: /run/secrets/agent_api_key_broski-pets-bridge
    secrets:
      - agent_api_key_broski-pets-bridge

  healer-agent:
    environment:
      # Phase 10E identity — code reads the file itself (env-or-file)
      HYPERCODE_AGENT_KEY_FILE: /run/secrets/agent_api_key_healer-agent
    secrets:
      - agent_api_key_healer-agent

  coder-agent:
    environment:
      # Phase 10E identity — code reads the file itself (env-or-file)
      HYPERCODE_AGENT_KEY_FILE: /run/secrets/agent_api_key_coder-agent
    secrets:
      - agent_api_key_coder-agent

  dashboard:
    environment:
      ORCHESTRATOR_API_KEY_FILE: /run/secrets/orchestrator_api_key
    secrets:
      - orchestrator_api_key

  celery-worker:
    environment:
      HYPERCODE_MEMORY_KEY_FILE: /run/secrets/memory_key
    secrets:
      - memory_key

  hyperhealth-api:
    environment:
      API_KEY_FILE: /run/secrets/api_key
    secrets:
      - api_key

  hyperhealth-worker:
    environment:
      API_KEY_FILE: /run/secrets/api_key
    secrets:
      - api_key

  project-strategist:
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - openai_api_key
