# ════════════════════════════════════════════════════════════════════════════════
# docker-compose.agents-full.yml
# 🤖 GHOST-AGENT OVERLAY — 11 agents unique to this file, + mission-executor
#
# 🪤 RESTORED 2026-09-12. Commit e1afd436 (2026-08-29, "feat: add mission-executor
# service and execution integration") claimed to only replace coderabbit-webhook,
# but its actual diff wholesale-replaced this entire 725-line file with a 27-line
# stub containing only mission-executor — silently deleting the compose
# definitions for all 11 agents below (brain-agent, tips-tricks-writer,
# security-engineer, system-architect, throttle-agent, super-hyper-broski-agent,
# test-agent, session-snapshot, hyper-split-agent, coderabbit-webhook,
# business-agent). None of them had run since — confirmed via `docker ps -a`
# (zero container history) and a repo-wide grep (only stray deploy.resources-only
# override stubs remained in docker-compose.memory-limits.yml/agents-lite.yml/
# on-demand.yml, none of which provide a base image/build/ports definition).
# `fleet-controller` and `mission-director`, also deleted by the same commit,
# are NOT restored here: fleet-controller now correctly lives in
# docker-compose.fleet.yml (added 2026-09-04), and mission-director has been
# added there too as part of this same fix (see that file) — both belong to the
# Phase 0-2 fleet/governance plane, not this ghost-agent overlay.
#
# One block adjusted on restore: brain-agent's `depends_on: chroma:
# condition: service_healthy` removed — `chroma` is not defined in the current
# core/agents stack (only in docker-compose.demo.yml/lean.yml/nano.yml/
# observability.yml, none of which are part of the standard launch), so this
# dependency would have made `docker compose config` fail outright. Its
# CHROMA_HOST/CHROMA_PORT env vars are left as-is (harmless if unused) since
# fixing the agent's own optional-chroma handling is a separate, non-compose
# concern. Everything else below is byte-for-byte the pre-deletion content
# (recovered via `git show e1afd436~1:docker-compose.agents-full.yml`),
# already using the corrected agents-net/data-net networks from the 2026-08-20
# phantom-network fix (predates this deletion, so it was never lost).
#
# Launch command: `docker compose --profile agents --profile hyper \
#   -f docker-compose.yml -f docker-compose.agents-full.yml up -d`
# (--profile agents activates most of this fleet; the 4 agents.yml defines under
# profiles:["hyper"] — agent-x, hyper-architect, hyper-observer, hyper-worker —
# need --profile hyper too. This file's own 11 agents + mission-executor have no
# profiles: key, so they're always included regardless of which --profile flags
# are passed.)
# ════════════════════════════════════════════════════════════════════════════════
#
# PORT MAP (host → container:8080) — this file's 11 agents only
# ─────────────────────────────────
# :8007  security-engineer
# :8010  system-architect        ← moved off :8008 2026-08-20 (was colliding with live healer-agent)
# :8013  hyper-split-agent       ← moved off :8096 2026-08-20 (was colliding with live safety-shepherd)
# :8014  throttle-agent
# :8015  super-hyper-broski-agent
# :8017  session-snapshot        ← moved off :8097 2026-08-20 (was colliding with live evolve-relay, --profile pets)
# :8018  tips-tricks-writer      ← moved off :8009 2026-08-20 (was colliding with live chroma, docker-compose.observability.yml)
# :8019  test-agent              ← moved off :8100 2026-08-20 (was colliding with live hyper-brain, --profile brain)
# :8020  business-agent
# :8024  coderabbit-webhook
# :8082  brain-agent
# :8000  mission-executor        ← added 2026-08-29, unaffected by this restore
# ─────────────────────────────────
# ✅ All agents depend_on crew-orchestrator (healthy) — via docker-compose.agents.yml
# ✅ All healthchecks have start_period
# ✅ Throttle-agent uses Redis DB 1 (rate limits) — SACRED RULE ✔

version: "3.9"

services:

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 1: CORE CREW (2 agents) — ORCHESTRATION BRAIN
  # (crew-orchestrator, agent-x, coder-agent moved to docker-compose.agents.yml —
  #  see item #0 resolution note at the top of this file)
  # ══════════════════════════════════════════════════════════════════════════════

  brain-agent:
    image: hypercode-brain-agent:latest
    build:
      context: ./agents/brain
      dockerfile: Dockerfile
    container_name: brain-agent
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - AGENT_NAME=brain-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - ADHD_MODE=true
      - DYSLEXIA_MODE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1GB
        reservations:
          cpus: "0.5"
          memory: 768MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=memory"

  tips-tricks-writer:
    image: hypercode-tips-tricks-agent:latest
    build:
      context: ./agents/09-tips-tricks-writer
      dockerfile: Dockerfile
    container_name: tips-tricks-writer
    ports:
      - "127.0.0.1:8018:8080"
    environment:
      - AGENT_NAME=tips-tricks-writer
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      hypercode-core:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=documentation"

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 2: SPECIALIST SQUAD (2 agents) — DEVELOPMENT CREW
  # (frontend/backend-specialist, database-architect, qa-engineer,
  #  devops-engineer, project-strategist moved to docker-compose.agents.yml)
  # ══════════════════════════════════════════════════════════════════════════════

  security-engineer:
    image: hypercode-security-engineer:latest
    build:
      context: ./agents/06-security-engineer
      dockerfile: Dockerfile
    container_name: security-engineer
    ports:
      - "127.0.0.1:8007:8080"
    environment:
      - AGENT_NAME=security-engineer
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=specialist"
      - "com.hypercode.role=security"

  system-architect:
    image: hypercode-system-architect:latest
    build:
      context: ./agents/07-system-architect
      dockerfile: Dockerfile
    container_name: system-architect
    ports:
      - "127.0.0.1:8010:8080"
    environment:
      - AGENT_NAME=system-architect
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=specialist"
      - "com.hypercode.role=system-design"

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 3: INFRASTRUCTURE AGENTS (3 agents) — SYSTEM COORDINATION
  # (hyper-architect, hyper-observer, hyper-worker, goal-keeper moved to
  #  docker-compose.agents.yml)
  # ══════════════════════════════════════════════════════════════════════════════

  throttle-agent:
    image: hypercode-throttle-agent:latest
    build:
      context: ./agents/throttle-agent
      dockerfile: Dockerfile
    container_name: throttle-agent
    ports:
      - "127.0.0.1:8014:8080"
    environment:
      - AGENT_NAME=throttle-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/1
      # ✅ SACRED RULE: Redis DB 1 = rate limits — NEVER change this
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      # docker-socket-proxy-healer's own header names it explicitly: "ONLY for
      # healer + throttle-agent" — was never actually wired up until now.
      # Never mount /var/run/docker.sock directly (Sacred Rule): route through
      # the scoped, read+POST-only proxy instead, same as healer-agent.
      - DOCKER_HOST=tcp://docker-socket-proxy-healer:2375
      - MEMSTREAM_URL=http://memstream:8009
      - MEMSTREAM_HEALTH_TOKEN=${MEMSTREAM_HEALTH_TOKEN:-dev}
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
      memstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=rate-limiting"

  super-hyper-broski-agent:
    image: hypercode-super-hyper-broski-agent:latest
    build:
      context: ./agents/super-hyper-broski-agent
      dockerfile: Dockerfile
    container_name: super-hyper-broski-agent
    ports:
      - "127.0.0.1:8015:8080"
    environment:
      - AGENT_NAME=super-hyper-broski-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=http://hypercode-ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2GB
        reservations:
          cpus: "1"
          memory: 1.5GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=mega-executor"

  test-agent:
    image: hypercode-test-agent:latest
    build:
      # context MUST be agents/, not agents/test-agent: the Dockerfile COPYs
      # a sibling agents/shared/ (agent_utils.py etc.) that's unreachable from
      # the narrower context — found 2026-08-20 during the first real fleet
      # launch attempt, same bug class as the hyper-observer/worker/architect
      # context fixes earlier the same day.
      context: ./agents
      dockerfile: test-agent/Dockerfile
    container_name: test-agent
    ports:
      - "127.0.0.1:8019:8080"
      # moved off :8100 2026-08-20 (was colliding with live hyper-brain, --profile brain)
    environment:
      - AGENT_NAME=test-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1GB
        reservations:
          cpus: "0.5"
          memory: 512MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=testing"

  # hypercode-mcp-server intentionally NOT defined here.
  # Removed 2026-08-20: this block pointed to ./agents/hypercode-mcp-server, which
  # does not exist (never did — no Dockerfile anywhere under that path). It also
  # reused container_name + host port :8823 already owned by the REAL, live
  # hypercode-mcp-server in docker-compose.agents.yml (context ./services/hypercode-mcp-server).
  # Composing the two merged into one service with build.context silently swapped to
  # the nonexistent ghost path and two conflicting port entries for the same host
  # port — guaranteed build/bind failure. This was never a distinct 25th agent;
  # it was a phantom duplicate of an already-live core service. See NEXT_TASKS.md.

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 4: UTILITY AGENTS (4 agents) — SUPPORT SERVICES
  # ══════════════════════════════════════════════════════════════════════════════

  session-snapshot:
    image: hypercode-session-snapshot:latest
    build:
      context: ./agents/session-snapshot
      dockerfile: Dockerfile
    container_name: session-snapshot
    ports:
      - "127.0.0.1:8017:8080"
    environment:
      - AGENT_NAME=session-snapshot
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=session"

  hyper-split-agent:
    image: hypercode-hyper-split-agent:latest
    build:
      context: ./agents/hyper-split-agent
      dockerfile: Dockerfile
    container_name: hyper-split-agent
    ports:
      - "127.0.0.1:8013:8080"
    environment:
      - AGENT_NAME=hyper-split-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=task-decomposition"

  coderabbit-webhook:
    image: hypercode-coderabbit-webhook:latest
    build:
      context: ./agents/coderabbit-webhook
      dockerfile: Dockerfile
    container_name: coderabbit-webhook
    ports:
      - "127.0.0.1:8024:8080"
    environment:
      - AGENT_NAME=coderabbit-webhook
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CODERABBIT_API_KEY=${CODERABBIT_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=pr-review"

  business-agent:
    image: hypercode-business-agent:latest
    build:
      context: ./agents/business
      dockerfile: Dockerfile
    container_name: business-agent
    ports:
      - "127.0.0.1:8020:8080"
    environment:
      - AGENT_NAME=business-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - HYPERCODE_API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=business"

  # ══════════════════════════════════════════════════════════════════════════════
  # PHASE 3: MISSION EXECUTOR — Live execution engine for approved missions.
  # Has ZERO LLM interpretation capability - only executes predefined plans.
  # Receives execution requests via Redis pub/sub (channel: mission_executions).
  # Reports results via Redis pub/sub (channel: mission_results).
  # Depends on crew-orchestrator for health checks (same as other agents).
  # Deliberately NOT gated on safety-shepherd — execution decisions are made
  # by human review via mission-director, not by this engine.
  # ══════════════════════════════════════════════════════════════════════════════
  mission-executor:
    image: hypercode-mission-executor:latest
    build:
      context: ./agents/mission-executor
      dockerfile: Dockerfile
    container_name: mission-executor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AGENT_NAME=mission-executor
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379/0
      - MISSION_EXECUTION_CHANNEL=${MISSION_EXECUTION_CHANNEL:-mission_executions}
      - MISSION_RESULT_CHANNEL=${MISSION_RESULT_CHANNEL:-mission_results}
      - MISSION_EXECUTION_TIMEOUT=${MISSION_EXECUTION_TIMEOUT:-300}
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=execution-engine"

  # NOTE: meta-research-architect moved into docker-compose.agents.yml
  # (2026-08-30) — that file is in docker-compose.yml's include: list and
  # already wires redis + the `agents` profile. Run it with:
  #   docker compose --profile agents up -d meta-research-architect

networks:
  # app-net / agent-net (singular) were phantom — never created anywhere in
  # the real stack, found 2026-08-20 during the first real fleet launch
  # attempt (all 11 services here referenced them, so none of them could ever
  # actually start a container, only build an image). The real shared
  # networks crew-orchestrator/redis/postgres are on are agents-net and
  # data-net (see docker-compose.core.yml, which creates them for real).
  agents-net:
    external: true
  data-net:
    external: true
