# ════════════════════════════════════════════════════════════════════════════════
# docker-compose.agents-full.yml
# 🤖 GHOST-AGENT OVERLAY — the 11 agents unique to this file
#
# ✅ RESOLVED 2026-08-20 (item #0, for real this time). This file used to duplicate
# 13 agent names that docker-compose.agents.yml already owns (crew-orchestrator,
# coder-agent, backend/frontend-specialist, database-architect, qa-engineer,
# devops-engineer, goal-keeper, project-strategist, agent-x, hyper-architect,
# hyper-observer, hyper-worker) — same-named services silently MERGE across `-f`
# files instead of erroring, and agents.yml's versions were the real, live,
# hardened ones (volume-mounted code, HYPER-SILLs loadout, security_opt) while
# this file's copies were unused stubs. Decision: agents.yml stays canonical for
# all 13 — their duplicate blocks are deleted from this file for good, not just
# "don't compose them together." This file now defines ONLY the 11 agents that
# have no home anywhere else. Composing it with the base stack is safe: zero
# service-name collisions, verified via `docker compose config`.
#
# Launch command: `docker compose --profile agents --profile hyper \
#   -f docker-compose.yml -f docker-compose.agents-full.yml up -d`
# (--profile agents activates most of this fleet; the 4 agents.yml defines under
# profiles:["hyper"] — agent-x, hyper-architect, hyper-observer, hyper-worker —
# need --profile hyper too. This file's own 11 agents have no profiles: key, so
# they're always included regardless of which --profile flags are passed.)
# ════════════════════════════════════════════════════════════════════════════════
#
# PORT MAP (host → container:8080) — this file's 11 agents only
# ─────────────────────────────────
# :8007  security-engineer
# :8010  system-architect        ← moved off :8008 2026-08-20 (was colliding with live healer-agent)
# :8013  hyper-split-agent       ← moved off :8096 2026-08-20 (was colliding with live safety-shepherd)
# :8014  throttle-agent
# :8015  super-hyper-broski-agent
# :8017  session-snapshot        ← moved off :8097 2026-08-20 (was colliding with live evolve-relay, --profile pets)
# :8018  tips-tricks-writer      ← moved off :8009 2026-08-20 (was colliding with live chroma, docker-compose.observability.yml)
# :8019  test-agent              ← moved off :8100 2026-08-20 (was colliding with live hyper-brain, --profile brain)
# :8020  business-agent
# :8024  coderabbit-webhook
# :8082  brain-agent
# ─────────────────────────────────
# ✅ All agents depend_on crew-orchestrator (healthy) — via docker-compose.agents.yml
# ✅ All healthchecks have start_period
# ✅ Throttle-agent uses Redis DB 1 (rate limits) — SACRED RULE ✔

version: "3.9"

services:

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 1: CORE CREW (2 agents) — ORCHESTRATION BRAIN
  # (crew-orchestrator, agent-x, coder-agent moved to docker-compose.agents.yml —
  #  see item #0 resolution note at the top of this file)
  # ══════════════════════════════════════════════════════════════════════════════

  brain-agent:
    image: hypercode-brain-agent:latest
    build:
      context: ./agents/brain
      dockerfile: Dockerfile
    container_name: brain-agent
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - AGENT_NAME=brain-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - ADHD_MODE=true
      - DYSLEXIA_MODE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1GB
        reservations:
          cpus: "0.5"
          memory: 768MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=memory"

  tips-tricks-writer:
    image: hypercode-tips-tricks-agent:latest
    build:
      context: ./agents/09-tips-tricks-writer
      dockerfile: Dockerfile
    container_name: tips-tricks-writer
    ports:
      - "127.0.0.1:8018:8080"
    environment:
      - AGENT_NAME=tips-tricks-writer
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      hypercode-core:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=documentation"

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 2: SPECIALIST SQUAD (2 agents) — DEVELOPMENT CREW
  # (frontend/backend-specialist, database-architect, qa-engineer,
  #  devops-engineer, project-strategist moved to docker-compose.agents.yml)
  # ══════════════════════════════════════════════════════════════════════════════

  security-engineer:
    image: hypercode-security-engineer:latest
    build:
      context: ./agents/06-security-engineer
      dockerfile: Dockerfile
    container_name: security-engineer
    ports:
      - "127.0.0.1:8007:8080"
    environment:
      - AGENT_NAME=security-engineer
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=specialist"
      - "com.hypercode.role=security"

  system-architect:
    image: hypercode-system-architect:latest
    build:
      context: ./agents/07-system-architect
      dockerfile: Dockerfile
    container_name: system-architect
    ports:
      - "127.0.0.1:8010:8080"
    environment:
      - AGENT_NAME=system-architect
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=specialist"
      - "com.hypercode.role=system-design"

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 3: INFRASTRUCTURE AGENTS (3 agents) — SYSTEM COORDINATION
  # (hyper-architect, hyper-observer, hyper-worker, goal-keeper moved to
  #  docker-compose.agents.yml)
  # ══════════════════════════════════════════════════════════════════════════════

  throttle-agent:
    image: hypercode-throttle-agent:latest
    build:
      context: ./agents/throttle-agent
      dockerfile: Dockerfile
    container_name: throttle-agent
    ports:
      - "127.0.0.1:8014:8080"
    environment:
      - AGENT_NAME=throttle-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/1
      # ✅ SACRED RULE: Redis DB 1 = rate limits — NEVER change this
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      # docker-socket-proxy-healer's own header names it explicitly: "ONLY for
      # healer + throttle-agent" — was never actually wired up until now.
      # Never mount /var/run/docker.sock directly (Sacred Rule): route through
      # the scoped, read+POST-only proxy instead, same as healer-agent.
      - DOCKER_HOST=tcp://docker-socket-proxy-healer:2375
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=rate-limiting"

  super-hyper-broski-agent:
    image: hypercode-super-hyper-broski-agent:latest
    build:
      context: ./agents/super-hyper-broski-agent
      dockerfile: Dockerfile
    container_name: super-hyper-broski-agent
    ports:
      - "127.0.0.1:8015:8080"
    environment:
      - AGENT_NAME=super-hyper-broski-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=http://hypercode-ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2GB
        reservations:
          cpus: "1"
          memory: 1.5GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=mega-executor"

  test-agent:
    image: hypercode-test-agent:latest
    build:
      # context MUST be agents/, not agents/test-agent: the Dockerfile COPYs
      # a sibling agents/shared/ (agent_utils.py etc.) that's unreachable from
      # the narrower context — found 2026-08-20 during the first real fleet
      # launch attempt, same bug class as the hyper-observer/worker/architect
      # context fixes earlier the same day.
      context: ./agents
      dockerfile: test-agent/Dockerfile
    container_name: test-agent
    ports:
      - "127.0.0.1:8019:8080"
      # moved off :8100 2026-08-20 (was colliding with live hyper-brain, --profile brain)
    environment:
      - AGENT_NAME=test-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1GB
        reservations:
          cpus: "0.5"
          memory: 512MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=testing"

  # hypercode-mcp-server intentionally NOT defined here.
  # Removed 2026-08-20: this block pointed to ./agents/hypercode-mcp-server, which
  # does not exist (never did — no Dockerfile anywhere under that path). It also
  # reused container_name + host port :8823 already owned by the REAL, live
  # hypercode-mcp-server in docker-compose.agents.yml (context ./services/hypercode-mcp-server).
  # Composing the two merged into one service with build.context silently swapped to
  # the nonexistent ghost path and two conflicting port entries for the same host
  # port — guaranteed build/bind failure. This was never a distinct 25th agent;
  # it was a phantom duplicate of an already-live core service. See NEXT_TASKS.md.

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 4: UTILITY AGENTS (4 agents) — SUPPORT SERVICES
  # ══════════════════════════════════════════════════════════════════════════════

  session-snapshot:
    image: hypercode-session-snapshot:latest
    build:
      context: ./agents/session-snapshot
      dockerfile: Dockerfile
    container_name: session-snapshot
    ports:
      - "127.0.0.1:8017:8080"
    environment:
      - AGENT_NAME=session-snapshot
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=session"

  hyper-split-agent:
    image: hypercode-hyper-split-agent:latest
    build:
      context: ./agents/hyper-split-agent
      dockerfile: Dockerfile
    container_name: hyper-split-agent
    ports:
      - "127.0.0.1:8013:8080"
    environment:
      - AGENT_NAME=hyper-split-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512MB
        reservations:
          cpus: "0.5"
          memory: 256MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=task-decomposition"

  coderabbit-webhook:
    image: hypercode-coderabbit-webhook:latest
    build:
      context: ./agents/coderabbit-webhook
      dockerfile: Dockerfile
    container_name: coderabbit-webhook
    ports:
      - "127.0.0.1:8024:8080"
    environment:
      - AGENT_NAME=coderabbit-webhook
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CODERABBIT_API_KEY=${CODERABBIT_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=pr-review"

  business-agent:
    image: hypercode-business-agent:latest
    build:
      context: ./agents/business
      dockerfile: Dockerfile
    container_name: business-agent
    ports:
      - "127.0.0.1:8020:8080"
    environment:
      - AGENT_NAME=business-agent
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - agents-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crew-orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256MB
        reservations:
          cpus: "0.25"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=utility"
      - "com.hypercode.role=business"

  # ══════════════════════════════════════════════════════════════════════════════
  # PHASE 0: FLEET CONTROLLER — structurally incapable of executing anything.
  # No docker.sock, no DOCKER_HOST, no ORCHESTRATOR_API_KEY. Depends only on
  # safety-shepherd (service_started, not service_healthy — Phase 0 must work
  # *correctly because* Shepherd might be down). Deliberately NOT gated on
  # crew-orchestrator: service_healthy (unlike every other agent in this file,
  # and a named, confirmed exception to CLAUDE.md's general Sacred Rule) —
  # fleet-controller holds no crew-orchestrator credential and no dispatch path
  # through it, so that health gate would only couple this boundary-proving
  # service to a second SPOF for no safety benefit. See
  # docs/superpowers/specs/2026-08-20-fleet-controller-phase0-design.md §7.
  # ══════════════════════════════════════════════════════════════════════════════
  fleet-controller:
    profiles: ["fleet"]
    image: hypercode-fleet-controller:latest
    build:
      context: ./agents/fleet-controller
      dockerfile: Dockerfile
    container_name: fleet-controller
    ports:
      - "127.0.0.1:8094:8080"
    environment:
      - AGENT_NAME=fleet-controller
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - SAFETY_SHEPHERD_URL=http://safety-shepherd:8096
      - CORE_URL=${CORE_URL:-http://hypercode-core:8000}
      - CORE_AGENT_KEY=${FLEET_CONTROLLER_CORE_AGENT_KEY:-}
    networks:
      - agents-net
    depends_on:
      safety-shepherd:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256MB
        reservations:
          cpus: "0.1"
          memory: 128MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=infrastructure"
      - "com.hypercode.role=fleet-control"

networks:
  # app-net / agent-net (singular) were phantom — never created anywhere in
  # the real stack, found 2026-08-20 during the first real fleet launch
  # attempt (all 11 services here referenced them, so none of them could ever
  # actually start a container, only build an image). The real shared
  # networks crew-orchestrator/redis/postgres are on are agents-net and
  # data-net (see docker-compose.core.yml, which creates them for real).
  agents-net:
    external: true
  data-net:
    external: true
