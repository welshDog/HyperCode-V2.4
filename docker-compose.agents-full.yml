# ════════════════════════════════════════════════════════════════════════════════
# docker-compose.agents-full.yml
# 🤖 25-AGENT FULL SQUAD DEPLOYMENT
#
# 🔴 DO NOT `-f` this together with docker-compose.yml right now — decided 2026-08-20.
# 14 of the ~24 agent names below are ALSO defined in docker-compose.agents.yml (or
# other base-included files) with different build contexts/ports/profiles. Compose
# merges same-named services across files instead of erroring, and 9 of these 14
# names are confirmed LIVE right now via the base stack (docker ps + container
# labels) — not via this file, which has never actually been composed up. Until the
# overlap is resolved for real (rename one side / retire duplicates / distinct
# names — undecided), this file is a standalone reference only. See NEXT_TASKS.md
# item #0 and CLAUDE.md's "Full Stack Launch Command" section.
#
# (Historical usage, once the above is resolved: `docker compose --profile agents
# -f docker-compose.yml -f docker-compose.agents-full.yml up -d` — --profile agents
# is required or crew-orchestrator silently drops from the merge. Confirmed 08-20.)
# Updated: August 20, 2026 — real port-collision fixes verified via `docker compose
# config`, not just grep. See NEXT_TASKS.md P1 "agents-full.yml name-collision audit".
# ════════════════════════════════════════════════════════════════════════════════
#
# PORT MAP (host → container:8080)
# ─────────────────────────────────
# :8001  project-strategist      ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8002  coder-agent             ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8003  backend-specialist      ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8004  database-architect      ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8005  qa-engineer             ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8006  devops-engineer         ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8007  security-engineer
# :8010  system-architect        ← moved off :8008 2026-08-20 (was colliding with live healer-agent)
# :8011  frontend-specialist
# :8013  hyper-split-agent       ← moved off :8096 2026-08-20 (was colliding with live safety-shepherd)
# :8014  throttle-agent
# :8015  super-hyper-broski-agent
# :8017  session-snapshot        ← moved off :8097 2026-08-20 (was colliding with live evolve-relay, --profile pets)
# :8018  tips-tricks-writer      ← moved off :8009 2026-08-20 (was colliding with live chroma, docker-compose.observability.yml)
# :8019  test-agent              ← moved off :8100 2026-08-20 (was colliding with live hyper-brain, --profile brain)
# :8020  business-agent          ⚠️ Dockerfile exists but builds mislabeled project-strategist code, not real business-agent logic — human decision needed, see NEXT_TASKS.md P2-1
# :8024  coderabbit-webhook
# :8050  goal-keeper             ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8081  crew-orchestrator       ⚠️ also defined in docker-compose.agents.yml (profiles:["agents"]) — same-name merge, unaudited
# :8082  brain-agent             ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8083  agent-x                 ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8091  hyper-architect         ⚠️ also defined in docker-compose.agents.yml (profiles:["hyper"], DIFFERENT build context) — same-name merge, unaudited
# :8092  hyper-observer          ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# :8093  hyper-worker            ⚠️ also defined in docker-compose.agents.yml — same-name merge, unaudited
# (hypercode-mcp-server removed 2026-08-20 — was a phantom, see block comment below)
# ─────────────────────────────────
# 🔴 14 of ~24 real agent names above are ALSO defined in docker-compose.agents.yml
#    (or other base-included files) with different build contexts/ports/profiles.
#    Same-named services across compose files MERGE, not error — the later -f file's
#    build.context/image wins silently, list fields like `ports` get unioned. This
#    means "launch the 25-agent fleet" has never deployed the roster this file
#    describes for most of these agents — it deploys some unaudited hybrid.
#    DECIDED 2026-08-20 (Bro's call): don't compose this file together with the base
#    stack until the overlap is fixed for real — see the block at the top of this
#    file. The rename/retire/distinct-names choice is still open.
# ✅ All agents depend_on crew-orchestrator (healthy)
# ✅ All healthchecks have start_period
# ✅ Throttle-agent uses Redis DB 1 (rate limits) — SACRED RULE ✔

version: "3.9"

services:

  # ══════════════════════════════════════════════════════════════════════════════
  # TIER 1: CORE CREW (5 agents) — ORCHESTRATION BRAIN
  # ══════════════════════════════════════════════════════════════════════════════

  crew-orchestrator:
    image: hypercode-crew-orchestrator:latest
    build:
      context: ./agents/crew-orchestrator
      dockerfile: Dockerfile
    container_name: crew-orchestrator
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - AGENT_NAME=crew-orchestrator
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - ORCHESTRATOR_MODE=swarm
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - app-net
      - agent-net
      - agents-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hypercode-core:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1.5GB
        reservations:
          cpus: "1"
          memory: 1GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=orchestrator"

  agent-x:
    image: hypercode-agent-x:latest
    build:
      context: ./agents/agent-x
      dockerfile: Dockerfile
    container_name: agent-x
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - AGENT_NAME=agent-x
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-dev}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_SOCKET_PROXY=http://docker-socket-proxy-healer:2375
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=http://hypercode-ollama:11434
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - app-net
      - agent-net
      - agents-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      docker-socket-proxy-healer:
        condition: service_started
      crew-orchestrator:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2GB
        reservations:
          cpus: "1"
          memory: 1.5GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "com.hypercode.tier=core"
      - "com.hypercode.role=meta-architect"

